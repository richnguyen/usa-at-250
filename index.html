ck Americans’ votes and enforced [[segregation]] for almost a century.","also":"The 11 Confederate states were readmitted to Congress between 1866 and 1870.","placeXY":[675.1,514.8]},{"id":"1867","date":"1867-03-30","when":"March 1867","label":"1867","fun":"Alaska is the farthest north and the farthest west state. Because some of its Aleutian Islands cross the 180° line, it is also, on a map, the farthest east.","title":"Nebraska joins, and Alaska is bought from Russia","states":["NE"],"acq":"a1867","place":{"name":"Sitka, Alaska","lon":-135.33,"lat":57.05},"what":"On March 1, 1867, Nebraska became the 37th state. Four weeks later, on March 30, the U.S. agreed to buy Alaska from Russia for $7.2 million, about two cents an acre. The U.S. flag was raised at Sitka on October 18, 1867.","why":["The Homestead Act brought farmers to Nebraska, and the Union Pacific Railroad was building west from Omaha.","Russia found Alaska hard to defend and feared losing it to Britain. It preferred to sell to the U.S.","Supporters valued Alaska’s fish, furs, and timber, and its position on the Pacific."],"person":{"name":"William H. Seward","life":"1801–1872","field":"Politics","role":"Secretary of State (1861–1869)","did":"Seward negotiated the Alaska treaty in an all-night meeting with Russia’s minister. Critics laughed at “Seward’s Folly” and “Seward’s Icebox.” Later, Alaska had gold rushes, starting in the 1880s, and big oil discoveries in 1957 and 1968."},"progress":"Alaska added about 586,000 square miles, more than twice the size of Texas.","promise":"In 1971, Alaska Native peoples won a historic land settlement: 44 million acres and nearly $1 billion.","cost":"No one asked the Alaska Native peoples, such as the Iñupiat, Yup’ik, Tlingit, and Unangan (Aleut), who had lived there for thousands of years. In Nebraska, the Pawnee, Lakota, and other nations were pushed off their lands.","also":"In 1866, Congress passed the first Civil Rights Act, which declared all people born in the U.S. to be citizens.","placeXY":[277.5,688.2]},{"id":"1869","date":"1869-05-10","when":"May 10, 1869","label":"1869","fun":"The golden spike did not stay in the track. Workers pulled it out right after the ceremony. Today it is in a museum at Stanford University.","title":"The golden spike joins a continent","states":[],"place":{"name":"Promontory Summit, Utah","lon":-112.55,"lat":41.62},"what":"At Promontory Summit, Utah, workers drove a golden spike to join two railroads: the Central Pacific, built east from California, and the Union Pacific, built west from Nebraska. A trip across the country that once took months by wagon now took about a week.","why":["The Pacific Railway Act of 1862 gave the railroad companies land and loans for every mile they built.","The nation wanted to tie California and the West to the rest of the Union.","Businesses wanted to move goods and people faster and more cheaply."],"person":{"name":"Leland Stanford","life":"1824–1893","field":"Economy","role":"President of the Central Pacific Railroad","did":"Stanford was one of four California businessmen, the “Big Four,” who built the Central Pacific over the Sierra Nevada mountains. He swung the hammer at the golden spike ceremony. Later he founded Stanford University."},"progress":"The railroad created a national market. Goods, mail, and people crossed the continent quickly, and new towns grew along the tracks.","promise":"Chinese immigrants did most of the dangerous work of building the Central Pacific. At its peak, about 9 of every 10 workers were Chinese. Today the U.S. Department of Labor honors them in its Hall of Honor.","cost":"Chinese workers were paid less than white workers. In 1882, the Chinese Exclusion Act became the first U.S. law to ban immigration by one nationality. The railroads also helped destroy the bison herds that Plains nations depended on.","also":"In December 1869, Wyoming Territory became the first place in the U.S. to give women the full right to vote (see 1890).","placeXY":[337,475]},{"id":"1876","date":"1876-08-01","when":"August 1, 1876","label":"1876","fun":"At the 1876 Centennial, visitors could climb up inside the arm and torch of the Statue of Liberty. It was shown there to build interest and raise money for the statue project.","title":"Colorado and America’s 100th birthday","states":["CO"],"place":{"name":"Denver","lon":-104.99,"lat":39.74},"what":"Colorado became the 38th state. It is called the “Centennial State” because it joined in the nation’s 100th year. That summer, millions of visitors came to the Centennial Exhibition in Philadelphia to see America’s newest inventions.","why":["Gold and silver finds (“Pikes Peak or Bust,” 1859) brought miners and new towns to the Rocky Mountains.","Railroads reached Denver in 1870, bringing more settlers and businesses.","Colorado’s leaders had tried for years before Congress and the President finally agreed."],"person":{"name":"Alexander Graham Bell","life":"1847–1922","field":"Science","role":"Inventor of the telephone","did":"Bell, an immigrant from Scotland and a teacher of deaf students, received a [[patent]] for the telephone in March 1876. At the Centennial Exhibition that June, he showed it to the judges and to Brazil’s emperor, who is said to have cried out, “My God, it speaks!”"},"progress":"The Centennial showed off the telephone, the typewriter, and a giant steam engine. The U.S. was becoming an industrial leader.","promise":"On July 4, 1876, Susan B. Anthony and other women read a “Declaration of Rights for Women” in Philadelphia. They reminded the nation that its promise was not yet complete.","cost":"In 1864, U.S. soldiers killed about 150 to 230 Cheyenne and Arapaho people, mostly women, children, and elders, at Sand Creek in Colorado. In 1881, most Ute people were forced out of the state.","also":"In June 1876, Lakota and Cheyenne warriors led by Sitting Bull and Crazy Horse defeated Custer’s army at the Little Bighorn in Montana.","placeXY":[408.3,507.9]},{"id":"1889","date":"1889-11-11","when":"November 2–11, 1889","label":"1889","fun":"Washington is the only state named after a president.","title":"Four states in ten days","states":["ND","SD","MT","WA"],"place":{"name":"Bismarck, North Dakota","lon":-100.78,"lat":46.81},"what":"In November 1889, four states joined in ten days: North and South Dakota (November 2), Montana (November 8), and Washington (November 11). President Benjamin Harrison had the two Dakota papers shuffled and covered on purpose, so no one knows which Dakota joined first.","why":["Railroads brought hundreds of thousands of settlers to the northern plains.","For years, Congress had blocked these states for party reasons. After the 1888 election, one party controlled Congress and the presidency, and the states were admitted.","Copper in Montana, wheat in the Dakotas, and timber in Washington created booming economies."],"person":{"name":"James J. Hill","life":"1838–1916","field":"Economy","role":"Railroad builder, “the Empire Builder”","did":"Born in Canada, Hill built the Great Northern Railway from St. Paul, Minnesota, to Seattle, Washington. It was finished in 1893, largely without federal land grants. To fill his trains, he brought settlers, many from Norway, Sweden, and Germany, and helped them start farms along the line."},"progress":"The new states linked the Great Lakes to the Pacific Northwest. Seattle became a gateway to Asia and, later, to Alaska’s gold fields.","promise":"Railroads advertised cheap land in Europe. For millions of immigrants, the northern plains became a new home.","cost":"In 1877, the U.S. took the Black Hills from the Lakota, breaking an 1868 treaty. In 1980, the Supreme Court agreed the land was taken illegally. The Lakota have refused the payment and still ask for the land.","also":"In 1886, the Statue of Liberty was dedicated in New York Harbor, a gift from the people of France.","placeXY":[451.2,413.1]},{"id":"1890","date":"1890-07-10","when":"July 3–10, 1890","label":"1890","fun":"Idaho’s state seal is the only one designed by a woman, the artist Emma Edwards Green.","title":"Idaho and Wyoming, and votes for women","states":["ID","WY"],"place":{"name":"Cheyenne, Wyoming","lon":-104.82,"lat":41.14},"what":"Idaho became the 43rd state on July 3, 1890, and Wyoming the 44th on July 10. Wyoming was the first state where women could vote in all elections. Its leaders refused to drop women’s voting rights, even when some members of Congress objected.","why":["Mining, cattle ranching, and the railroad brought settlers to the region.","Wyoming Territory gave women the vote in 1869. Historians think leaders wanted publicity and more settlers, especially women, in a place with few of them.","When Congress hesitated, Wyoming lawmakers reportedly replied: “We will remain out of the Union one hundred years rather than come in without the women.”"],"person":{"name":"Esther Hobart Morris","life":"1814–1902","field":"Politics","role":"First woman to serve as a justice of the peace in the U.S.","did":"In 1870, Morris became a judge in South Pass City, Wyoming, the first woman known to hold such an office in the United States. She became a national symbol of Wyoming’s women’s rights, and her statue stands in the U.S. Capitol."},"progress":"In 1924, Wyoming elected Nellie Tayloe Ross, the first woman governor of a U.S. state.","promise":"Wyoming is called “the Equality State.” Its example helped the women’s [[suffrage]] movement across the West.","cost":"In December 1890, U.S. soldiers killed about 250 or more Lakota men, women, and children at Wounded Knee, South Dakota. The same year, the Census said the [[frontier]] was closed.","also":"Ellis Island opened in New York Harbor in 1892. Over the next 62 years, about 12 million immigrants entered the U.S. there.","placeXY":[411.1,489]},{"id":"1896","date":"1896-01-04","when":"January 4, 1896","label":"1896","fun":"Utah’s Great Salt Lake is much saltier than the ocean, so swimmers float easily.","title":"Utah, after a long wait","states":["UT"],"place":{"name":"Salt Lake City","lon":-111.89,"lat":40.76},"what":"Utah became the 45th state. Members of the Church of Jesus Christ of Latter-day Saints (often called Mormons) had settled the Salt Lake Valley in 1847. Utah asked to become a state many times over almost 50 years.","why":["Congress would not admit Utah while the church allowed [[polygamy]], marriage to more than one wife.","In 1890, the church announced the end of new plural marriages, and Utah’s constitution banned polygamy.","Irrigation turned Utah’s desert valleys into productive farms."],"person":{"name":"Martha Hughes Cannon","life":"1857–1932","field":"Science","role":"Physician; first woman elected as a state senator in the U.S.","did":"Cannon trained as a medical doctor and worked for public health. Utah’s 1896 constitution gave women the vote. In the first state election that year, she won a seat in the state Senate, beating several men, including her own husband."},"progress":"As a senator, Cannon worked to create Utah’s State Board of Health and wrote laws to protect public health.","promise":"Women in Utah had full voting rights 24 years before the 19th Amendment gave the vote to women across the country.","cost":"Earlier, settlers in Utah had fought the Ute, Shoshone, and other nations. In 1863, U.S. soldiers killed at least 250 Shoshone at the Bear River Massacre.","also":"In 1896, the Supreme Court’s Plessy v. Ferguson decision allowed racial segregation under the rule of “separate but equal.”","placeXY":[341.7,487.5]},{"id":"1898","date":"1898-08-12","when":"July–August 1898","label":"1898","fun":"ʻIolani Palace in Honolulu, home of Hawaii’s last king and queen, is the only official royal residence in the United States.","title":"Hawaii, and lands across the sea","states":[],"acq":"a1898","place":{"name":"Honolulu","lon":-157.86,"lat":21.31},"what":"In 1898, the United States reached beyond North America. Congress voted to [[annex]] Hawaii, President McKinley signed the law on July 7, and the U.S. flag was raised in Honolulu on August 12. After a short war with Spain that year, the U.S. also took Puerto Rico, Guam, and the Philippines.","why":["American sugar planters controlled much of Hawaii’s economy. In 1893, a group of them, supported by U.S. Marines, [[overthrew|overthrow]] Hawaii’s queen.","Pearl Harbor in Hawaii was valuable as a navy base in the middle of the Pacific.","The Spanish–American War made the U.S. a world power with territories overseas."],"person":{"name":"Queen Liliʻuokalani","life":"1838–1917","field":"Politics","role":"Last [[monarch]] of the Kingdom of Hawaiʻi","did":"Liliʻuokalani tried to return power to Native Hawaiians with a new constitution. After she was overthrown, she protested peacefully, wrote her life story, and went to Washington to oppose annexation. More than 21,000 Native Hawaiians signed petitions against it. She also wrote the famous song “Aloha ʻOe.”"},"progress":"Hawaii became a key link between the U.S. and Asia, and later a center of Pacific trade and travel.","promise":"In 1993, Congress officially apologized to Native Hawaiians for the U.S. role in overthrowing their kingdom.","cost":"Native Hawaiians lost their government without their consent. From 1896 until 1986, schools could not teach in the Hawaiian language.","also":"Puerto Ricans became U.S. citizens in 1917. Puerto Rico is still a U.S. territory today.","placeXY":[367.3,679.7]},{"id":"1903","date":"1903-12-17","when":"December 17, 1903","label":"1903","fun":"The Wright brothers tossed a coin to decide who would fly first. Wilbur won, but his try on December 14 failed. Orville made the first successful flight three days later.","title":"Twelve seconds that changed the world","states":[],"place":{"name":"Kitty Hawk, North Carolina","lon":-75.67,"lat":36.02},"what":"Near Kitty Hawk, North Carolina, Orville and Wilbur Wright made the first powered, controlled airplane flight. The first flight lasted 12 seconds and went 120 feet. Their fourth flight that day lasted 59 seconds.","why":["The brothers studied birds and earlier gliders, and they tested wing shapes in a homemade wind tunnel.","They solved the key problem: how to control a plane in the air.","Kitty Hawk had strong, steady winds and soft sand for landings."],"person":{"name":"Orville and Wilbur Wright","life":"1871–1948 · 1867–1912","field":"Science","role":"Inventors of the airplane","did":"The Wrights ran a bicycle shop in Dayton, Ohio, and used its money and tools to build their aircraft. They had no college degrees, but they worked like scientists: testing, measuring, and improving step by step."},"progress":"Within 25 years, airplanes carried mail and passengers. Flight changed travel, trade, and war.","promise":"Two ordinary people with curiosity and hard work changed the world. In 1969, Neil Armstrong carried a small piece of the Wright Flyer to the Moon.","cost":"Airplanes also became weapons. They were first used widely in World War I (1914–1918).","also":"In 1908, Henry Ford introduced the Model T car. His moving assembly line (1913) made cars cheap enough for working families.","placeXY":[711.4,524.1]},{"id":"1907","date":"1907-11-16","when":"November 16, 1907","label":"1907","fun":"Oklahomans are called “Sooners” after settlers who sneaked onto the land “sooner” than the official start of the 1889 land run.","title":"Oklahoma, where many nations met","states":["OK"],"place":{"name":"Guthrie, Oklahoma","lon":-97.43,"lat":35.88},"what":"Oklahoma became the 46th state. It joined two areas: Oklahoma Territory, opened to settlers in “land runs” starting in 1889, and Indian Territory, where the U.S. had moved many Native nations. The name comes from Choctaw words meaning “red people.”","why":["In the first Oklahoma Land Run in 1889, thousands of settlers raced on horses and in wagons to claim free land.","Oil was discovered, and Oklahoma’s oil boom began.","In 1905, leaders of the Five Tribes proposed a separate Native-led state called “Sequoyah,” but Congress did not accept it."],"person":{"name":"Theodore Roosevelt","life":"1858–1919","field":"Politics","role":"26th president (1901–1909)","did":"Roosevelt signed the 1906 law that joined Oklahoma and Indian Territory into one state, and in 1907 he signed the proclamation that made it a state. As president, he also protected about 230 million acres of public land as national forests, parks, and wildlife refuges."},"progress":"Oil made Tulsa the “Oil Capital of the World” in the 1920s.","promise":"Today, 39 tribal nations have their headquarters in Oklahoma. In 2020, the Supreme Court ruled in McGirt v. Oklahoma that the Muscogee (Creek) reservation still exists under federal law.","cost":"Native nations lost most of their land when the government divided it into small private plots. In 1921, a white mob destroyed Greenwood, Tulsa’s successful Black neighborhood, and killed as many as 300 people.","also":"In 1906, Upton Sinclair’s book \u003ci>The Jungle\u003c/i> led to the first national food-safety laws.","placeXY":[485.2,561.1]},{"id":"1912","date":"1912-02-14","when":"January–February 1912","label":"1912","fun":"Santa Fe, New Mexico, founded around 1610, is the oldest state capital in the United States.","title":"New Mexico and Arizona complete the lower 48","states":["NM","AZ"],"place":{"name":"Santa Fe","lon":-105.94,"lat":35.69},"what":"New Mexico became the 47th state on January 6, 1912, and Arizona the 48th on February 14. The map of the “lower 48” states, between Canada and Mexico, was now complete.","why":["Railroads, mining (especially copper), and ranching grew quickly in the region.","Congress had waited for decades, partly because of prejudice against the region’s many Spanish-speaking and Native residents.","President Taft first [[vetoed|veto]] Arizona because its constitution let voters remove judges. Arizona dropped that rule, joined, and then voted it back in."],"person":{"name":"Octaviano Larrazolo","life":"1859–1930","field":"Politics","role":"Delegate to New Mexico’s 1910 constitutional convention; later governor and U.S. senator","did":"Born in Mexico, Larrazolo fought to protect Spanish-speaking citizens in New Mexico’s constitution: their right to vote and to go to school could not be taken away because of their language. In 1928, he became the first Mexican-American U.S. senator."},"progress":"Large dams such as Roosevelt Dam (1911) brought water to the desert, and cities like Phoenix began to grow.","promise":"New Mexico’s constitution has strong protections for Spanish speakers. The state’s Hispanic and Native cultures remain at the center of its identity.","cost":"Native Americans in both states could not vote in state elections until 1948, when courts finally struck down the bans.","also":"In 1913, the 17th Amendment let voters choose their U.S. senators directly.","placeXY":[395.2,562]},{"id":"1920","date":"1920-08-18","when":"August 18, 1920","label":"1920","fun":"The 19th Amendment was first introduced in Congress in 1878. Congress finally passed it in 1919, 41 years later.","title":"Women win the vote","states":[],"place":{"name":"Nashville, Tennessee","lon":-86.78,"lat":36.16},"what":"Tennessee became the 36th state to ratify the 19th Amendment, the last one needed. The amendment says the right to vote cannot be denied “on account of sex.” Millions of American women could now vote. The deciding vote came from a 24-year-old lawmaker, Harry Burn, after his mother wrote to him asking him to vote yes.","why":["Women had organized for 72 years, since the Seneca Falls meeting in 1848.","Women’s work during World War I strengthened their demand for equal citizenship.","Western states, such as Wyoming, Utah, and Colorado, had already shown that women voting worked."],"person":{"name":"Susan B. Anthony","life":"1820–1906","field":"Politics","role":"Leader of the women’s [[suffrage]] movement","did":"Anthony traveled the country for more than 50 years, giving speeches for women’s rights. In 1872, she was arrested for voting in Rochester, New York. The 19th Amendment was nicknamed the “Susan B. Anthony Amendment,” although she died 14 years before it passed."},"progress":"Women became voters, candidates, and leaders. In 1916, Jeannette Rankin of Montana became the first woman elected to Congress.","promise":"Anthony’s motto was: “Failure is impossible.”","cost":"Many women of color still could not vote. Black women in the South faced Jim Crow laws. Many Native American and Asian American women could not vote until later laws in 1924, 1952, and 1965.","also":"In 1924, the Indian Citizenship Act made all Native Americans born in the U.S. citizens.","placeXY":[596.7,547.2]},{"id":"1935","date":"1935-08-14","when":"August 14, 1935","label":"1935","fun":"The first monthly Social Security check went to Ida May Fuller of Vermont in 1940. She had paid less than $25 in Social Security taxes, lived to 100, and collected nearly $23,000.","title":"The Great Depression and a new safety net","states":[],"place":{"name":"Washington, D.C.","lon":-77.04,"lat":38.9},"what":"The stock market crashed in October 1929, and the Great [[Depression]] began. By 1933, about one in four workers had no job. President Franklin D. Roosevelt’s “New Deal” created jobs and new programs. On August 14, 1935, he signed the Social Security Act.","why":["Banks failed, farms were lost, and millions of families lost their savings.","In the Dust Bowl, drought and dust storms drove farm families from the Great Plains.","Many Americans wanted the government to protect people from the worst effects of hard times."],"person":{"name":"Frances Perkins","life":"1880–1965","field":"Economy","role":"Secretary of Labor (1933–1945); the first woman in a U.S. Cabinet","did":"In 1911, Perkins saw the Triangle Shirtwaist Factory fire in New York, where 146 workers died. She spent her life making work safer and fairer. As Secretary of Labor, she led the team that designed Social Security and unemployment insurance, and she helped win a national minimum wage in 1938."},"progress":"Social Security gave older Americans a monthly income, and unemployment insurance helped workers who lost their jobs. New Deal workers built roads, bridges, dams, and schools that are still used today.","promise":"The New Deal promised that in hard times, Americans would not be left alone. Social Security still supports tens of millions of people.","cost":"At first, Social Security left out farmworkers and household workers. Many Black, Mexican-American, and women workers held those jobs, so they were excluded until changes in the 1950s.","also":"In 1936, Jesse Owens, a Black American athlete, won four gold medals at the Olympic Games in Berlin, Nazi Germany.","placeXY":[687.4,490.4]},{"id":"1941","date":"1945-09-02","when":"1941–1945","label":"1941","fun":"Navajo “Code Talkers” sent secret messages in their own language during World War II. The enemy never broke their code.","title":"World War II and the “arsenal of democracy”","states":[],"place":{"name":"Pearl Harbor","lon":-157.95,"lat":21.36},"what":"On December 7, 1941, Japan attacked the U.S. Navy base at Pearl Harbor, Hawaii, and the United States entered World War II. More than 16 million Americans served in the armed forces. The war ended in Europe in May 1945, and Japan formally surrendered on September 2, 1945.","why":["Germany, Italy, and Japan were conquering countries in Europe, Africa, and Asia.","The attack on Pearl Harbor killed about 2,400 Americans and united the country.","American factories could make more planes, ships, and tanks than any other country."],"person":{"name":"Franklin D. Roosevelt","life":"1882–1945","field":"Politics","role":"32nd president (1933–1945)","did":"Roosevelt called the U.S. the “arsenal of democracy” and led the country through most of the war. Polio had paralyzed his legs in 1921, and he often used a wheelchair. He was elected four times, more than any other president. He died in April 1945, weeks before victory in Europe."},"progress":"Factories hired millions of women (“Rosie the Riveter”) and Black workers. The GI Bill (1944) helped about 8 million veterans go to college or job training and buy homes.","promise":"The U.S. helped create the United Nations (1945) and helped rebuild Europe with the Marshall Plan, hoping to prevent another world war.","cost":"About 405,000 Americans died. At home, about 120,000 Japanese Americans, most of them U.S. citizens, were forced into prison camps. In 1988, Congress apologized and paid the survivors.","also":"The Japanese American 442nd Regimental Combat Team became one of the most decorated units in U.S. history. One of its soldiers was Daniel Inouye (see 1959).","placeXY":[366.4,679.1]},{"id":"1959","date":"1959-08-21","when":"January–August 1959","label":"1959","fun":"Measured from its base on the ocean floor, Hawaii’s Mauna Kea is taller than Mount Everest: more than 33,000 feet, mostly under water.","title":"Alaska and Hawaii: the 49th and 50th stars","states":["AK","HI"],"place":{"name":"Honolulu","lon":-157.86,"lat":21.31},"what":"Alaska became the 49th state on January 3, 1959, and Hawaii the 50th on August 21, 1959. For the first time, states joined that did not touch the other states. The 50-star flag flew for the first time on July 4, 1960.","why":["World War II showed how important Alaska and Hawaii were for defense in the Pacific.","Alaskans and Hawaiians voted strongly for statehood. They wanted full voting members in Congress and a vote for president.","Some members of Congress had blocked statehood for years, partly for party reasons and partly because of prejudice against Hawaii’s mostly Asian American population."],"person":{"name":"Daniel K. Inouye","life":"1924–2012","field":"Politics","role":"War hero; Hawaii’s first congressman and longtime senator","did":"Inouye, the son of Japanese immigrants, lost his right arm fighting in Italy in 1945. He later received the Medal of Honor. He worked for statehood in Hawaii’s territorial [[legislature]]. In 1959, he became Hawaii’s first member of the U.S. House, the first Japanese American in Congress. He then served in the Senate for almost 50 years."},"progress":"The country now reached from the Arctic to the tropics. Alaska brought oil, fish, and wilderness. Hawaii brought a gateway to Asia and the Pacific.","promise":"Hawaii was the first state where most people were not of European descent. It sent the first Asian American senator, Hiram Fong, to Washington.","cost":"The 1959 vote in Hawaii offered only two choices: statehood or remaining a territory. Some Native Hawaiians still say that independence should have been an option.","also":"In 1957, the Soviet Union launched Sputnik, the first satellite. The U.S. answered by creating NASA in 1958.","placeXY":[367.3,679.7]},{"id":"1964","date":"1964-07-02","when":"July 2, 1964","label":"1964","fun":"The famous “I have a dream” words were not in King’s written speech. Witnesses say the singer Mahalia Jackson called out, “Tell them about the dream, Martin!” Soon after, he did.","title":"Civil rights: making the promise real","states":[],"place":{"name":"Washington, D.C.","lon":-77.04,"lat":38.9},"what":"President Lyndon B. Johnson signed the Civil Rights Act. It banned discrimination based on race, color, religion, sex, or national origin in jobs, schools, and public places such as hotels and restaurants. The next year, the Voting Rights Act of 1965 protected the right to vote.","why":["For decades, Black Americans in the South lived under segregation and were blocked from voting.","Peaceful protests, such as the Montgomery Bus Boycott (1955–56), lunch-counter sit-ins (1960), and the March on Washington (1963), moved the nation’s conscience.","TV news showed Americans the violence used against peaceful protesters, as in Birmingham, Alabama, in 1963."],"person":{"name":"Martin Luther King Jr.","life":"1929–1968","field":"Politics","role":"Minister and [[civil rights]] leader","did":"King led the Montgomery Bus Boycott and helped lead the 1963 March on Washington, where about 250,000 people heard his “I Have a Dream” speech. He taught [[nonviolent]] protest and won the Nobel Peace Prize in 1964. He was murdered in 1968."},"progress":"Segregation signs came down. After 1965, the number of Black voters in the South rose sharply, and more Black Americans were elected to office.","promise":"King dreamed that his children would “not be judged by the color of their skin but by the content of their character.”","cost":"Many civil rights workers were beaten, jailed, or killed, including Medgar Evers in 1963 and three young volunteers in Mississippi in 1964.","also":"In 1965, a new immigration law ended quotas that favored Europeans. More immigrants began to arrive from Asia, Latin America, and Africa.","placeXY":[687.4,490.4]},{"id":"1969","date":"1969-07-20","when":"July 20, 1969","label":"1969","fun":"Apollo 11 left a small silicon disk on the Moon. It carries goodwill messages from the leaders of 73 countries.","title":"One giant leap","states":[],"place":{"name":"Kennedy Space Center","lon":-80.6,"lat":28.57},"what":"Apollo 11 astronauts Neil Armstrong and Buzz Aldrin landed on the Moon, while Michael Collins circled above. Armstrong said: “That’s one small step for [a] man, one giant leap for mankind.” Around 600 million people watched on television.","why":["In 1961, President John F. Kennedy set the goal of landing a person on the Moon before 1970.","The “Space Race” with the Soviet Union pushed both countries to compete in science and technology.","About 400,000 people worked on the Apollo program."],"person":{"name":"Katherine Johnson","life":"1918–2020","field":"Science","role":"NASA mathematician","did":"Johnson calculated flight paths for America’s first spaceflights. In 1962, astronaut John Glenn asked for her to check the computer’s numbers before his flight around the Earth. She worked on the calculations for Apollo 11’s trip to the Moon. In 2015, she received the Presidential Medal of Freedom."},"progress":"The space program pushed forward computers, satellites, weather forecasting, and medical technology.","promise":"The astronauts left a sign on the Moon: “We came in peace for all mankind.” Johnson’s story, told in the film \u003ci>Hidden Figures\u003c/i> (2016), inspired a new generation of girls and Black students in science.","cost":"Johnson and other Black women mathematicians at NASA’s Langley center first worked in a segregated office, and they faced both racism and sexism.","also":"In October 1969, the first message was sent over ARPANET, the network that grew into the Internet (see 1983).","placeXY":[683,634.2]},{"id":"1983","date":"1983-01-01","when":"January 1, 1983","label":"1983","fun":"The first message ever sent over ARPANET, in 1969, was supposed to be “LOGIN.” The system crashed after just two letters, so the first message was “LO.”","title":"The Internet connects the world","states":[],"place":{"name":"Silicon Valley, California","lon":-122.03,"lat":37.37},"what":"ARPANET, a computer network funded by the U.S. government, switched to a new shared language for computers called TCP/IP. Many people call this the birthday of the Internet. In the 1990s, the World Wide Web and web browsers brought the Internet into homes, schools, and businesses.","why":["The U.S. Department of Defense paid for research on networks that could share information and keep working if parts were damaged.","Universities wanted to share computers and research.","Personal computers, from companies like Apple (1976) and IBM (1981), put computing power on people’s desks."],"person":{"name":"Vint Cerf","life":"born 1943","field":"Science","role":"Computer scientist; co-inventor of TCP/IP","did":"With Robert Kahn, Cerf designed TCP/IP in 1973–74: the rules that let different computer networks talk to each other. They made the design open and free, so anyone could build on it. Both men received the Presidential Medal of Freedom in 2005."},"progress":"Email, online shopping, video calls, and smartphones all depend on the Internet. Today, more than five billion people use it.","promise":"An open Internet means anyone can share ideas, learn, or start a business, including people learning English, like many readers of this page.","cost":"The Internet also brought new problems: false information, privacy risks, and a “digital divide” between people with and without access.","also":"In 1981, Sandra Day O’Connor became the first woman on the Supreme Court.","placeXY":[232.7,512.8]},{"id":"2020","date":"2020-12-14","when":"2020","label":"2020","fun":"Sandra Lindsay, a nurse who had immigrated from Jamaica, was the first person in the United States to get a COVID-19 vaccine outside a clinical trial, on December 14, 2020.","title":"A pandemic, and a race for vaccines","states":[],"place":{"name":"Philadelphia (University of Pennsylvania)","lon":-75.19,"lat":39.95},"what":"In 2020, the COVID-19 [[pandemic]] spread around the world. Schools and businesses closed, and by 2022 more than one million Americans had died. Scientists made safe, effective [[vaccines|vaccine]] in less than a year using a new technology called mRNA. The first U.S. shot outside a clinical trial was given on December 14, 2020, to a nurse in New York City.","why":["A new virus spread quickly, and no one had protection against it.","Decades of earlier research on mRNA made fast vaccine development possible.","Governments and companies spent billions of dollars to speed up testing and production."],"person":{"name":"Katalin Karikó","life":"born 1955","field":"Science","role":"Biochemist; 2023 Nobel Prize in Medicine","did":"Karikó moved to the U.S. from Hungary in 1985. For years her mRNA research got little money, and she was demoted. Working with Drew Weissman at the University of Pennsylvania, she found in 2005 how to make mRNA safe to use in the body. That discovery made the COVID-19 mRNA vaccines possible."},"progress":"Scientists are now testing mRNA against flu, cancer, and other diseases.","promise":"Karikó’s story is an immigrant’s story. She arrived with her family’s savings hidden inside her daughter’s teddy bear, and her work helped save millions of lives.","cost":"The pandemic hit older people, low-income workers, and many Black, Hispanic, and Native American communities especially hard.","also":"In 2021, NASA flew the Ingenuity helicopter on Mars, the first powered flight on another planet. It carried a small piece of cloth from the 1903 Wright Flyer.","placeXY":[701.4,471.6]},{"id":"2026","date":"2026-07-04","when":"July 4, 2026","label":"2026","fun":"A 250th anniversary has a special name: a “semiquincentennial.”","title":"America at 250","states":[],"place":{"name":"Philadelphia (Independence Hall)","lon":-75.15,"lat":39.95},"what":"The United States celebrates 250 years since the Declaration of Independence. It began as 13 states along the Atlantic coast. Today it has 50 states, about 340 million people, and land that reaches from the Arctic to the tropics.","whyTitle":"What made it possible","why":["New land, from purchases, treaties, and wars, that grew the country to about 3.8 million square miles.","New people: Native nations, enslaved Africans and their descendants, and immigrants from every continent.","A Constitution that can change. It has been amended 27 times."],"person":{"name":"We the People","life":"1776–today","field":"Everyone","role":"About 340 million Americans","did":"The Constitution begins with “We the People.” Every milestone in this story was shaped by ordinary people as well as famous ones: farmers, workers, inventors, soldiers, teachers, and immigrants. People living today will write the next chapter. Perhaps that includes you."},"progress":"In 250 years, Americans built railroads, flew to the Moon, connected the world through the Internet, and created vaccines in record time.","promise":"Each generation has widened the promise of 1776, that all people are created equal. It is still a work in progress.","costTitle":"Still unfinished","cost":"Washington, D.C., and U.S. territories such as Puerto Rico and Guam still have no voting members in Congress. Americans continue to debate who belongs and who has a voice, as they always have.","also":"","placeXY":[701.8,471.5]}],"states":{"DE":["Delaware","1787-12-07"],"PA":["Pennsylvania","1787-12-12"],"NJ":["New Jersey","1787-12-18"],"GA":["Georgia","1788-01-02"],"CT":["Connecticut","1788-01-09"],"MA":["Massachusetts","1788-02-06"],"MD":["Maryland","1788-04-28"],"SC":["South Carolina","1788-05-23"],"NH":["New Hampshire","1788-06-21"],"VA":["Virginia","1788-06-25"],"NY":["New York","1788-07-26"],"NC":["North Carolina","1789-11-21"],"RI":["Rhode Island","1790-05-29"],"VT":["Vermont","1791-03-04"],"KY":["Kentucky","1792-06-01"],"TN":["Tennessee","1796-06-01"],"OH":["Ohio","1803-03-01"],"LA":["Louisiana","1812-04-30"],"IN":["Indiana","1816-12-11"],"MS":["Mississippi","1817-12-10"],"IL":["Illinois","1818-12-03"],"AL":["Alabama","1819-12-14"],"ME":["Maine","1820-03-15"],"MO":["Missouri","1821-08-10"],"AR":["Arkansas","1836-06-15"],"MI":["Michigan","1837-01-26"],"FL":["Florida","1845-03-03"],"TX":["Texas","1845-12-29"],"IA":["Iowa","1846-12-28"],"WI":["Wisconsin","1848-05-29"],"CA":["California","1850-09-09"],"MN":["Minnesota","1858-05-11"],"OR":["Oregon","1859-02-14"],"KS":["Kansas","1861-01-29"],"WV":["West Virginia","1863-06-20"],"NV":["Nevada","1864-10-31"],"NE":["Nebraska","1867-03-01"],"CO":["Colorado","1876-08-01"],"ND":["North Dakota","1889-11-02"],"SD":["South Dakota","1889-11-02"],"MT":["Montana","1889-11-08"],"WA":["Washington","1889-11-11"],"ID":["Idaho","1890-07-03"],"WY":["Wyoming","1890-07-10"],"UT":["Utah","1896-01-04"],"OK":["Oklahoma","1907-11-16"],"NM":["New Mexico","1912-01-06"],"AZ":["Arizona","1912-02-14"],"AK":["Alaska","1959-01-03"],"HI":["Hawaii","1959-08-21"]},"stateInf ranklin D. Roosevelt","artist":"Leon A. Perskie","date":"1944","license":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:FDR_1944_Color_Portrait.jpg","w":360,"h":519}},"1959":{"ill":{"file":"img/i1959.jpg","title":"President Eisenhower signs the proclamation admitting Hawaii","artist":"U.S. Army Pictorial Agency.","date":"August 21, 1959","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:President_Eisenhower_Formally_Admits_Hawaii_into_the_United_States.jpg","w":960,"h":721}},"1964":{"ill":{"file":"img/i1964.jpg","title":"The March on Washington","artist":"or not provided","date":"August 28, 1963","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Civil_Rights_March_on_Washington,_D.C._(Crowd_of_marchers_at_the_Lincoln_Memorial.)_-_NARA_-_542055.tif","w":913,"h":900},"person":{"file":"img/p1964.jpg","title":"Martin Luther King Jr.","artist":"Dick DeMarsico","date":"1964","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Martin_Luther_King_Jr_NYWTS.jpg","w":360,"h":437}},"1969":{"ill":{"file":"img/i1969.jpg","title":"Buzz Aldrin on the Moon","artist":"Neil Armstrong, NASA","date":"July 20, 1969","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Aldrin_Apollo_11.jpg","w":900,"h":900},"person":{"file":"img/p1969.jpg","title":"Katherine Johnson","artist":"NASA","date":"1983","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Katherine_Johnson_1983.jpg","w":360,"h":450}},"1983":{"ill":{"file":"img/i1983.jpg","title":"ARPANET logical map","artist":"ARPANET","date":"March 1977","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Arpanet_logical_map,_march_1977.png","w":1000,"h":716},"person":{"file":"img/p1983.jpg","title":"Vint Cerf","artist":"Вени Марковски Veni Markovski","date":"2010","license":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Vint_Cerf_-_2010.jpg","w":360,"h":360}},"2020":{"ill":{"file":"img/i2020.jpg","title":"COVID-19 vaccine doses","artist":"U.S. Secretary of Defense","date":"December 2020","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Pfizer-BioNTech_COVID-19_vaccine_(2020)_F.jpg","w":1100,"h":733}},"2026":{"ill":{"file":"img/i2026.jpg","title":"Independence Hall, Philadelphia","artist":"颐园居","date":"2024","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Independence_Hall,_Philadelphia_20240528.jpg","w":1100,"h":733},"person":{"file":"img/p2026.jpg","title":"“We the People,” the opening words of the U.S. Constitution","artist":"Constitution_Pg1of4_AC.jpg: Constitutional Convention derivative work:","date":"1787","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Constitution_We_the_People.jpg","w":360,"h":130}}},"about":"\n\u003cp>Move the slider, use the arrow buttons, or press ← and → on your keyboard to travel through 47 milestones, from the Declaration of Independence in 1776 to the 250th anniversary in 2026. Use the buttons on the left of the map (States, Picture, Fun fact, What happened, Why, People, Progress, Promise, Cost, Also) to open the parts of the story you want to read; press a button again to close it. Open sections stay open as you move to other milestones. Tap any underlined word for a simple meaning. Tap a state on the map to jump to the moment it joined.\u003c/p>\n\u003ch3>How to read the map\u003c/h3>\n\u003cp>Blue states are part of the Union at that moment. Red marks what is new. Light blue is land the United States owned that was not yet a state. In 1861–65, gray shows the 11 states that left the Union. The map uses today’s state borders for clarity. The borders of territorial acquisitions are approximate and follow the usual U.S. history maps (for example, the 1818 Red River Basin is shown as part of the Louisiana Purchase). Alaska, Hawaii and Puerto Rico are shown in boxes below the lower 48, not to scale with it, from the time each became U.S. land.\u003c/p>\n\u003ch3>The flag\u003c/h3>\n\u003cp>The flag in the top left is the official U.S. flag in force on the date of each milestone. Before June 1777, Americans used the Continental Colors: 13 stripes with the British flag in the corner. Congress adopted the Stars and Stripes on June 14, 1777. The Flag Act of 1794 added two stars and two stripes in 1795. The Flag Act of 1818 went back to 13 stripes and added one star for each state, on the July 4 after it joined, so the flag can have fewer stars than there are states. Laws did not set the pattern of the stars until 1912, so earlier flags are shown with a typical pattern. The 48-, 49- and 50-star layouts are the official ones.\u003c/p>\n\u003ch3>Sources\u003c/h3>\n\u003cp>Statehood and ratification dates: U.S. National Archives and state records. Land added by each acquisition: U.S. Census Bureau and Bureau of Land Management tables of territorial acquisitions (square miles, land and water; published tables differ by less than 1%, so figures are rounded); the 2026 figure is today’s official total area of the 50 states and D.C. Population: U.S. decennial census counts, with estimates for 1776 and 1780 and the Census Bureau’s 2024 estimate. State flags next to each new state are today’s official flags (as of 2026), from Wikimedia Commons; Mississippi (2021), Utah (2024) and Minnesota (2024) adopted new flags recently. State areas are today’s total areas (land and water) from the U.S. Census Bureau’s 2010 census. Capitals are the seat of government on the day each state joined. State shapes: U.S. Census Bureau cartographic boundaries, via the us-atlas project. Other countries: Natural Earth, via the world-atlas project.\u003c/p>\n\u003ch3>Image credits\u003c/h3>\n\u003col>\u003cli>\u003cb>1776\u003c/b> Illustration: \u003ci>Declaration of Independence\u003c/i> by John Trumbull (1818). \u003ca href=\"https://commons.wikimedia.org/wiki/File:Declaration_of_Independence_(1819),_by_John_Trumbull.jpg\" target=\"_blank\" <script>
(() => {
const { stops, states, acq, pop, eras, glossary, geo, images, original13, confederacy } = DATA;
const $ = (s, el = document) => el.querySelector(s);
const svg = $('#map');
const N = stops.length;
const ORD = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
const MONTHS = ['Jan.','Feb.','March','April','May','June','July','Aug.','Sept.','Oct.','Nov.','Dec.'];
const fmtDate = iso => { const [y, m, d] = iso.split('-').map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// state order numbers (official order of statehood)
const order = Object.entries(states).sort((a, b) => a[1][1].localeCompare(b[1][1]) || a[0].localeCompare(b[0]));
const ordinal = {}; order.forEach(([p], i) => ordinal[p] = i + 1);
ordinal.ND = 39; ordinal.SD = 40;

const inUnion = (p, date) => (original13.includes(p) && date >= '1776-07-04') || states[p][1] <= date;

// ---------- glossary markup ----------
function gloss(text) {
  return text.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, shown, key) => {
    const k = (key || shown).toLowerCase();
    if (!glossary[k]) return shown;
    return `<button type="button" class="term" data-k="${esc(k)}" aria-expanded="false">${shown}</button>`;
  });
}

// ---------- flag ----------
// The official flag in force on a date. Stars and Stripes from June 14, 1777; 15 stars and stripes from
// May 1, 1795; from July 4, 1818, 13 stripes and one star per state, added on the July 4 after a state joins.
const FLAGS = (() => {
  const list = [
    { from: '1775-12-03', union: true },
    { from: '1777-06-14', stars: 13, stripes: 13 },
    { from: '1795-05-01', stars: 15, stripes: 15 }
  ];
  let prev = 0;
  for (let y = 1818; y <= 1960; y++) {
    const d = `${y}-07-04`;
    const n = Object.values(states).filter(v => v[1] < d).length;
    if (n !== prev) { list.push({ from: d, stars: n, stripes: 13 }); prev = n; }
  }
  list.forEach((e, i) => { e.to = list[i + 1] ? list[i + 1].from : null; });
  return list;
})();
const flagAt = date => FLAGS.filter(f => f.from <= date).pop();

function starPath(x, y, r) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .382 : r;
    d += (i ? 'L' : 'M') + (x + rr * Math.cos(a)).toFixed(2) + ' ' + (y + rr * Math.sin(a)).toFixed(2);
  }
  return d + 'Z';
}
// Star positions in the blue canton. The 1912, 1959 and 1960 layouts are the official ones;
// earlier laws set no pattern, so those flags use a typical layout.
function starLayout(n, cw, ch) {
  const pts = [];
  let r;
  if (n === 13) {
    for (let i = 0; i < 13; i++) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / 13;
      pts.push([cw / 2 + ch * .34 * Math.cos(a), ch / 2 + ch * .34 * Math.sin(a)]);
    }
    r = ch * .085;
  } else if (n === 50) {
    for (let row = 0; row < 9; row++) for (let c = 0; c < (row % 2 ? 5 : 6); c++) pts.push([cw / 12 * (1 + 2 * c + row % 2), ch / 10 * (row + 1)]);
    r = 3.08;
  } else if (n === 49) {
    for (let row = 0; row < 7; row++) for (let c = 0; c < 7; c++) pts.push([cw / 15 * (1 + 2 * c + row % 2), ch / 8 * (row + 1)]);
    r = 3.2;
  } else if (n === 48) {
    for (let row = 0; row < 6; row++) for (let c = 0; c < 8; c++) pts.push([cw / 8 * (c + .5), ch / 6 * (row + .5)]);
    r = 3.1;
  } else {
    const rows = Math.min(7, Math.max(3, Math.round(Math.sqrt(n / 1.41))));
    const base = Math.floor(n / rows), extra = n % rows, cols = Math.ceil(n / rows);
    const sx = cw / cols, sy = ch / rows;
    for (let row = 0; row < rows; row++) {
      const long = Math.floor((row + 1) * extra / rows) > Math.floor(row * extra / rows);
      const k = base + (long ? 1 : 0);
      for (let c = 0; c < k; c++) pts.push([sx * (c + .5 + (cols - k) / 2), sy * (row + .5)]);
    }
    r = Math.min(sx, sy) * .36;
  }
  return pts.map(([x, y]) => starPath(x, y, r)).join('');
}
function flagSVG(f) {
  const W = 190, H = 100, red = '#b22234', white = '#ffffff', blue = '#3c3b6e';
  const n = f.union ? 13 : f.stripes, sh = H / n;
  const ch = sh * (n === 15 ? 8 : 7), cw = 76;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect width="${W}" height="${H}" fill="${white}"/>`;
  for (let i = 0; i < n; i += 2) s += `<rect y="${(i * sh).toFixed(3)}" width="${W}" height="${sh.toFixed(3)}" fill="${red}"/>`;
  if (f.union) {
    // British Union Flag of 1606 in the canton: St Andrew's white saltire under St George's red cross
    const t = ch / 5;
    s += `<svg width="${cw}" height="${ch.toFixed(3)}" viewBox="0 0 ${cw} ${ch.toFixed(3)}"><rect width="${cw}" height="${ch}" fill="${blue}"/>`
      + `<path d="M0 0L${cw} ${ch}M${cw} 0L0 ${ch}" stroke="${white}" stroke-width="${t}"/>`
      + `<rect x="0" y="${ch / 2 - t * .85}" width="${cw}" height="${t * 1.7}" fill="${white}"/><rect x="${cw / 2 - t * .85}" y="0" width="${t * 1.7}" height="${ch}" fill="${white}"/>`
      + `<rect x="0" y="${ch / 2 - t / 2}" width="${cw}" height="${t}" fill="${red}"/><rect x="${cw / 2 - t / 2}" y="0" width="${t}" height="${ch}" fill="${red}"/></svg>`;
  } else {
    s += `<rect width="${cw}" height="${ch.toFixed(3)}" fill="${blue}"/><path fill="${white}" d="${starLayout(f.stars, cw, ch)}"/>`;
  }
  return s + '</svg>';
}
let lastFlag = null;
function showFlag(s) {
  const f = flagAt(s.date), el = $('#flag');
  const y0 = f.from.slice(0, 4), y1 = f.to ? f.to.slice(0, 4) : null;
  const what = f.union ? 'Continental Colors' : `${f.stars} stars, ${f.stripes} stripes`;
  const when = f.union ? 'used 1775–1777, before the Stars and Stripes' : (y1 ? `official flag ${y0}–${y1}` : `official flag since July 4, ${y0}`);
  $('#flag-cap').innerHTML = `<b>${what}</b> · ${when}`;
  el.setAttribute('aria-label', `U.S. flag in ${s.label}: ${what}, ${when}`);
  if (f !== lastFlag) {
    el.innerHTML = flagSVG(f);
    if (lastFlag) { el.classList.remove('changed'); void el.offsetWidth; el.classList.add('changed'); }
    lastFlag = f;
  }
}

// ---------- stats ----------
function stats(s) {
  const n = Math.max(13, Object.keys(states).filter(p => states[p][1] <= s.date).length);
  $('#st-states').textContent = n;
  let sq = 0, any = false;
  for (const a of Object.values(acq)) if (a.date <= s.date) { sq += a.sqmi; any = true; }
  if (s.id === '2026') sq = 3796742;
  $('#st-area').innerHTML = any
    ? `${(sq / 1e6).toFixed(sq < 1e6 ? 2 : 1)}M sq mi<small>${(sq * 2.58999 / 1e6).toFixed(1)}M km²</small>`
    : `<small style="margin:0">not yet set by treaty</small>`;
  const y = s.date.slice(0, 4);
  let row = pop[0];
  for (const r of pop) if (r[0] <= y) row = r;
  $('#st-pop').innerHTML = `${row[1].toFixed(1)}M<small>${row[2] ? row[0] + ' est.' : row[0] + ' census'}</small>`;
}

// ---------- map ----------
const stEls = {}, lblEls = {}, leadEls = {};
svg.querySelectorAll('.st').forEach(el => stEls[el.dataset.p] = el);
svg.querySelectorAll('.lbl').forEach(el => lblEls[el.dataset.p] = el);
svg.querySelectorAll('.leader').forEach(el => leadEls[el.dataset.p] = el);
const acqEls = {}, acqEdge = {}, acqLbl = {};
svg.querySelectorAll('.acq').forEach(el => acqEls[el.dataset.a] = el);
svg.querySelectorAll('.acq-edge').forEach(el => acqEdge[el.dataset.a] = el);
svg.querySelectorAll('.acq-lbl').forEach(el => acqLbl[el.dataset.a] = el);
const pin = $('#pin'), pinText = $('#pin text');

function mapState(s) {
  const fresh = new Set(s.states);
  const sec = s.seceded ? new Set(confederacy) : new Set();
  for (const p in stEls) {
    const el = stEls[p], on = inUnion(p, s.date);
    el.classList.toggle('in', on && !fresh.has(p) && !sec.has(p));
    el.classList.toggle('sec', on && sec.has(p) && !fresh.has(p));
    el.classList.toggle('new', fresh.has(p));
    if (fresh.has(p)) { el.style.animation = 'none'; el.getBBox(); el.style.animation = ''; }
    const l = lblEls[p];
    if (l) {
      const named = fresh.has(p) && s.states.length <= 4 && !l.classList.contains('call');
      l.dataset.on = on ? '1' : '';
      l.classList.toggle('newname', named);
      l.textContent = named ? states[p][0] : p;
    }
  }
  for (const a in acqEls) {
    const base = a.replace('hi', '');
    const info = acq[base];
    const on = info && info.date <= s.date;
    const isNew = s.acq === base;
    acqEls[a].classList.toggle('on', on && !isNew);
    acqEls[a].classList.toggle('fresh', isNew);
    if (acqEdge[a]) acqEdge[a].classList.toggle('fresh', isNew);
    if (acqLbl[a]) acqLbl[a].classList.toggle('show', isNew);
  }
  // Alaska, Hawaii and Puerto Rico appear in their insets only once they become U.S. land
  const insetFrom = { AK: acq.a1867.date, HI: acq.a1898.date, PR: acq.a1898.date };
  svg.querySelectorAll('[data-inset]').forEach(el => el.classList.toggle('inset-off', s.date < insetFrom[el.dataset.inset]));
  if (s.place && s.placeXY) {
    pin.removeAttribute('hidden'); pin.dataset.x = s.placeXY[0]; pin.dataset.y = s.placeXY[1];
    pinText.textContent = s.place.name;
  } else pin.setAttribute('hidden', '');
  legend(s);
}

function legend(s) {
  const rows = [];
  rows.push(['new', s.states.length ? (s.id === '1776' ? 'Declaring independence' : (s.statesNote || 'Joined now')) : null]);
  rows.push(['in', 'In the Union']);
  if (s.seceded) rows.push(['sec', 'Left the Union, 1861–65']);
  if (s.date >= '1783-09-03') rows.push(['terr', 'U.S. land, not a state yet']);
  if (s.acq) rows.push(['new acqsw', 'Newly added land']);
  rows.push(['out', 'Not U.S.']);
  $('#legend').innerHTML = rows.filter(r => r[1]).map(([c, t]) =>
    `<div class="row"><span class="sw ${c === 'new acqsw' ? 'terr" style="background:var(--terr-new);outline:1.5px dashed var(--new);outline-offset:1px' : c}"></span><span>${t}</span></div>`).join('')
    + '<span class="note">Today’s state borders; territory borders approximate</span>';
}

// The view is fixed on the continental United States (the lower 48 plus the Alaska, Hawaii and Puerto Rico insets)
let vb = [0, 0, geo.W, geo.H];
function targetBox() {
  const [x, y, w, h] = geo.frame;
  return [x - 14, y - 16, w + 28, h + 50];
}
// Fit the frame to the panel, centered. The year card may cover a corner of the map (often Alaska).
function fitAspect(b) {
  const r = svg.clientWidth / Math.max(1, svg.clientHeight);
  let [x, y, w, h] = b;
  if (w / h > r) { const nh = w / r; y -= (nh - h) / 2; h = nh; } else { const nw = h * r; x -= (nw - w) / 2; w = nw; }
  return [x, y, w, h];
}
// show a state's abbreviation only where it fits at the current zoom
function fitLabels(v) {
  const sc = svg.clientWidth / v[2];
  for (const p in lblEls) {
    const l = lblEls[p], b = geo.states[p].b, on = !!l.dataset.on;
    let show = on;
    if (on && l.classList.contains('call')) show = sc >= 1.15;
    else if (on && !l.classList.contains('newname')) show = (b[1][0] - b[0][0]) * sc > 26 && (b[1][1] - b[0][1]) * sc > 16;
    l.classList.toggle('show', show);
    if (leadEls[p]) leadEls[p].classList.toggle('show', show);
  }
}
function applyVB(v) {
  vb = v;
  svg.setAttribute('viewBox', v.map(n => n.toFixed(1)).join(' '));
  const k = v[2] / Math.max(1, svg.clientWidth);
  svg.style.setProperty('--k', k.toFixed(4));
  if (!pin.hasAttribute('hidden')) {
    pin.setAttribute('transform', `translate(${pin.dataset.x} ${pin.dataset.y}) scale(${k.toFixed(4)})`);
    const right = +pin.dataset.x > v[0] + v[2] * .62;
    pinText.setAttribute('text-anchor', right ? 'end' : 'start');
    pinText.setAttribute('x', right ? -11 : 11);
  }
}
let anim = 0;
function zoomTo(s, instant) {
  const to = fitAspect(targetBox());
  const from = vb.slice();
  fitLabels(to);
  cancelAnimationFrame(anim);
  if (instant || reduced) return applyVB(to);
  const t0 = performance.now(), dur = 1100;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), e = ease(t);
    applyVB(from.map((f, i) => f + (to[i] - f) * e));
    if (t < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

// tooltip
const tip = $('#tip');
function stateTip(p) {
  const s = stops[cur], [name, d] = states[p];
  let line;
  if (original13.includes(p)) line = s.date < d
    ? `One of the 13 original states. Ratified the Constitution ${fmtDate(d)} (${ORD(ordinal[p])}).`
    : `Original state · ratified the Constitution ${fmtDate(d)} (${ORD(ordinal[p])})`;
  else if (inUnion(p, s.date)) line = `${ORD(ordinal[p])} state · joined ${fmtDate(d)}`;
  else line = `Not a state yet · joins ${fmtDate(d)} as the ${ORD(ordinal[p])} state`;
  return `<b>${esc(name)}</b><br>${line}`;
}
svg.addEventListener('pointermove', e => {
  const el = e.target.closest('.st');
  if (!el || e.pointerType === 'touch') { tip.hidden = true; return; }
  tip.innerHTML = stateTip(el.dataset.p);
  tip.hidden = false;
  const r = svg.parentElement.getBoundingClientRect();
  let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  if (x + 250 > r.width) x -= 270;
  if (y + 80 > r.height) y -= 90;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
svg.addEventListener('pointerleave', () => tip.hidden = true);
svg.addEventListener('click', e => {
  const el = e.target.closest('.st'); if (!el) return;
  const p = el.dataset.p;
  const i = stops.findIndex(s => s.states.includes(p) && s.id !== '1776');
  if (i >= 0) go(i);
});

// ---------- story ----------

function credit(img, kind) {
  if (!img) return '';
  const who = img.artist ? ` by ${esc(img.artist)}` : '';
  const when = img.date ? ` (${esc(img.date)})` : '';
  return `${kind}: <i>${esc(img.title)}</i>${who}${when}. <a href="${esc(img.page)}" target="_blank" rel="noopener">Wikimedia Commons</a>, ${esc(img.license)}.`;
}
// The year card on the map: the year, and a fact entry for each state that joins at this milestone
// (flag, order, date, today's area with rank, capital then and now). Three or more states use a compact entry.
const areaRank = Object.keys(DATA.stateInfo).sort((a, b) => DATA.stateInfo[b].area - DATA.stateInfo[a].area);
function stateEntry(p, compact) {
  const [name, d] = states[p], info = DATA.stateInfo[p] || {};
  const orig = original13.includes(p);
  const label = orig ? `${ORD(ordinal[p])} to ratify` : `${ORD(ordinal[p])} state`;
  const rank = areaRank.indexOf(p) + 1;
  let capNote;
  if (info.note) capNote = info.note + (info.cap === info.now || info.note.includes(info.now) ? '' : `; today ${info.now}`);
  else capNote = info.cap === info.now ? 'still the capital today' : `today ${info.now}`;
  const fl = DATA.stateFlags[p];
  const flag = fl ? `<img class="ycs-flag" src="${esc(fl.file)}" alt="Flag of ${esc(name)}" width="${fl.w}" height="${fl.h}" title="Today’s official flag of ${esc(name)}">` : '';
  const area = `${info.area.toLocaleString('en-US')} sq mi`;
  const cap = info.cap ? esc(info.cap) : 'none fixed';
  if (compact) return `<div class="ycs compact"><div class="ycs-head">${flag}<div>
      <p class="ycs-name">${esc(name)}<span class="ycs-ord">${label}</span></p>
      <p class="ycs-facts">${fmtDate(d)} · ${area} (${ORD(rank)}/50) · capital <b title="${esc(capNote)}">${cap}</b></p>
    </div></div></div>`;
  return `<div class="ycs"><div class="ycs-head">${flag}<div><p class="ycs-name">${esc(name)}</p><p class="ycs-ord">${label}</p></div></div><dl>
    <div><dt>${orig ? 'Ratified' : 'Joined'}</dt><dd>${fmtDate(d)}</dd></div>
    <div><dt>Area today</dt><dd>${area}<small>rank ${ORD(rank)}/50</small></dd></div>
    <div><dt>Capital then</dt><dd>${info.cap ? esc(info.cap) : 'None fixed'}<small>${esc(capNote)}</small></dd></div>
  </dl></div>`;
}
function renderMilestone(s) {
  $('#ms-title').textContent = s.title;
}
// New states (with flags and facts) and any land added, for the States panel
function statesBody(s) {
  let html = '';
  if (s.id === '1776') html = '<div class="ycs note">The 13 original states declare independence together. Each one joins the Union under the Constitution when it ratifies, from 1787 to 1790.</div>';
  else if (s.states.length) html = s.states.map(p => stateEntry(p, s.states.length > 3)).join('');
  if (s.acq && acq[s.acq]) html += `<div class="ycs land"><span class="sw"></span><p><b>${esc(acq[s.acq].name)}</b> <span>· about ${acq[s.acq].approx} sq mi of land added</span></p></div>`;

}
function renderDock(s) {
  $('#dock').innerHTML = '<p class="dock-h">Read the story</p>' + SECTIONS.map(sec => {
    const has = sec.has(s), on = open.has(sec.id);
    const n = sec.count ? sec.count(s) : 0;
    return `<button type="button" class="sec-btn" data-sec="${sec.id}" aria-pressed="${on}" aria-controls="panel-${sec.id}"${has ? '' : ' aria-disabled="true"'}>${svgIcon(sec.id)}<span>${sec.label}</span>${n ? `<b class="badge" aria-label="${n} new">${n}</b>` : ''}<i class="dot" aria-hidden="true"></i></button>`;
  }).join('');
}
function renderPanels() {
  const s = stops[cur];
  renderDock(s);
  const wrap = $('#panels');
  wrap.innerHTML = SECTIONS.filter(sec => open.has(sec.id)).map(sec =>
    `<section class="panel" id="panel-${sec.id}" data-sec="${sec.id}" aria-label="${esc(sec.title(s))}">
      <div class="panel-h">${svgIcon(sec.id)}<h3>${esc(sec.title(s))}</h3>
        <button type="button" class="x" data-close-sec="${sec.id}" aria-label="Close ${esc(sec.label)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      ${sectionBody(sec.id, s)}
    </section>`).join('');
  wrap.scrollTop = 0;
}
function toggleSection(id) {
  if (open.has(id)) open.delete(id); else open.add(id);
  saveOpen();
  renderPanels();
  const el = $('#panel-' + id);
  if (el) el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
}
$('#dock').addEventListener('click', e => { const b = e.target.closest('.sec-btn'); if (b) toggleSection(b.dataset.sec); });
$('#panels').addEventListener('click', e => { const b = e.target.closest('[data-close-sec]'); if (b) toggleSection(b.dataset.closeSec); });

// glossary popover
const popEl = $('#pop');
let popFor = null;
function showPop(btn) {
  const k = btn.dataset.k;
  popEl.innerHTML = `<b>${esc(k)}</b>${esc(glossary[k])}`;
  popEl.hidden = false;
  const r = btn.getBoundingClientRect();
  const pw = Math.min(280, innerWidth - 24);
  let x = Math.min(Math.max(12, r.left), innerWidth - pw - 12);
  let y = r.bottom + 8;
  popEl.style.left = x + 'px'; popEl.style.top = y + 'px';
  const ph = popEl.offsetHeight;
  if (y + ph > innerHeight - 12) popEl.style.top = (r.top - ph - 8) + 'px';
  if (popFor) popFor.setAttribute('aria-expanded', 'false');
  popFor = btn; btn.setAttribute('aria-expanded', 'true');
}
function hidePop() { popEl.hidden = true; if (popFor) popFor.setAttribute('aria-expanded', 'false'); popFor = null; }
document.addEventListener('click', e => {
  const t = e.target.closest('.term');
  if (t) { popFor === t ? hidePop() : showPop(t); e.stopPropagation(); return; }
  if (!e.target.closest('#pop')) hidePop();
});
document.addEventListener('mouseover', e => { const t = e.target.closest('.term'); if (t && matchMedia('(hover: hover)').matches) showPop(t); });
document.addEventListener('mouseout', e => { const t = e.target.closest('.term'); if (t && matchMedia('(hover: hover)').matches && !t.contains(e.relatedTarget)) hidePop(); });
$('#panels').addEventListener('scroll', hidePop, { passive: true });

// ---------- timeline ----------
const slider = $('#slider');
slider.max = N - 1;
const pos = i => `calc(var(--thumb) / 2 + (100% - var(--thumb)) * ${i / (N - 1)})`;
$('#ticks').innerHTML = stops.map((s, i) => `<span class="tick ${s.states.length || s.acq ? 'state' : ''}" style="left:${pos(i)}" title="${esc(s.label)}: ${esc(s.title)}"></span>`).join('');
const eraIdx = eras.map(e => {
  const idx = stops.map((s, i) => [s, i]).filter(([s]) => s.date.slice(0, 4) >= e.from && s.date.slice(0, 4) <= e.to).map(([, i]) => i);
  return { e, a: idx[0], b: idx[idx.length - 1] };
}).filter(x => x.a !== undefined);
$('#eras').innerHTML = eraIdx.map(({ e, a, b }, k) => {
  const next = eraIdx[k + 1];
  const right = next ? `calc(100% - ${pos(next.a - .5)})` : '0';
  return `<span class="era-band" data-era="${e.id}" style="left:${a === 0 ? '0' : pos(a - .5)};right:${right}" title="${esc(e.name)}">${esc(e.name)}</span>`;
}).join('');
const labelIdx = new Set([0, N - 1, ...eraIdx.map(x => x.a)]);
function ylabels(i) {
  $('#ylabels').innerHTML = [...labelIdx].filter(j => Math.abs(j - i) > 1).map(j => `<span class="ylabel${j === 0 || j === N - 1 ? ' edge' : ''}" style="left:${pos(j)}">${esc(stops[j].label)}</span>`).join('');
}
slider.addEventListener('input', () => go(+slider.value, true));

// ---------- navigation ----------
let cur = -1;
function go(i, fromSlider) {
  i = Math.max(0, Math.min(N - 1, i));
  if (i === cur) return;
  cur = i;
  const s = stops[i];
  hidePop();
  $('#yr').textContent = s.label;
  if (!fromSlider) slider.value = i;
  slider.setAttribute('aria-valuetext', `${s.label}: ${s.title}`);
  $('#bubble').textContent = s.label;
  $('#bubble').style.left = pos(i);
  $('#rail-fill').style.width = `${(i / (N - 1)) * 100}%`;
  document.querySelectorAll('.tick').forEach((t, j) => t.classList.toggle('past', j <= i));
  const era = eras.find(e => s.date.slice(0, 4) >= e.from && s.date.slice(0, 4) <= e.to);
  document.querySelectorAll('.era-band').forEach(b => b.classList.toggle('cur', era && b.dataset.era === era.id));
  ylabels(i);
  $('#btn-prev').disabled = i === 0; $('#btn-next').disabled = i === N - 1;
  stats(s); showFlag(s); mapState(s); renderMilestone(s); renderPanels(); zoomTo(s);
  try { history.replaceState(null, '', '#' + s.id); } catch (e) {}
}
$('#btn-prev').addEventListener('click', () => { stopPlay(); go(cur - 1); });
$('#btn-next').addEventListener('click', () => { stopPlay(); go(cur + 1); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hidePop(); closeSheets(); return; }
  if (e.target.closest('input, textarea, select, .sheet-overlay:not([hidden])')) return;
  if (e.key === 'ArrowRight') { stopPlay(); go(cur + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { stopPlay(); go(cur - 1); e.preventDefault(); }
});

let timer = 0;
function stopPlay() { clearInterval(timer); timer = 0; $('#btn-play').setAttribute('aria-label', 'Play the story'); $('#play-ico').innerHTML = '<path d="M8 5v14l11-7z"/>'; }
$('#btn-play').addEventListener('click', () => {
  if (timer) return stopPlay();
  if (cur === N - 1) go(0);
  $('#btn-play').setAttribute('aria-label', 'Pause');
  $('#play-ico').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  timer = setInterval(() => { if (cur >= N - 1) return stopPlay(); go(cur + 1); }, 6500);
});

new ResizeObserver(() => { if (cur >= 0) zoomTo(stops[cur], true); }).observe(svg);

// ---------- overlays ----------
function openSheet(id) { const o = $(id); o.hidden = false; o.querySelector('[data-close]').focus(); }
function closeSheets() { document.querySelectorAll('.sheet-overlay').forEach(o => o.hidden = true); }
document.querySelectorAll('.sheet-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-close]')) closeSheets(); }));
$('#btn-words').addEventListener('click', () => openSheet('#ov-words'));
$('#btn-about').addEventListener('click', () => openSheet('#ov-about'));

// ---------- light / dark mode ----------
const themeBtn = $('#btn-theme');
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const ICON_SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>';
const isDark = () => {
  const t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : sysDark.matches;
};
function paintThemeBtn() {
  const dark = isDark();
  themeBtn.innerHTML = (dark ? ICON_SUN : ICON_MOON) + `<span>${dark ? 'Light' : 'Dark'}</span>`;
  themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
themeBtn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
  paintThemeBtn();
});
sysDark.addEventListener('change', paintThemeBtn);
new MutationObserver(paintThemeBtn).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
paintThemeBtn();
$('#words-list').innerHTML = Object.keys(glossary).sort().map(k => `<dt>${esc(k)}</dt><dd>${esc(glossary[k])}</dd>`).join('');
$('#about-body').innerHTML = DATA.about;

// ---------- start ----------
const fromHash = () => stops.findIndex(s => '#' + s.id === location.hash);
addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== cur) go(i); });
const start = fromHash();
go(start >= 0 ? start : 0);
zoomTo(stops[cur], true);
})();
</script>
</body>
</html>
