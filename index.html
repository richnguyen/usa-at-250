<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>From 13 to 50</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive map of how the United States grew from 13 states to 50, 1776–2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* Layout: an atlas spread. Map plate on the left that zooms as the nation grows; the story on the right; a timeline rail along the bottom. */
:root {
  --paper: #f3f5f8;
  --sheet: #fbfcfd;
  --ink: #162133;
  --ink-2: #4a576d;
  --rule: #d4dbe4;
  --water: #d7e3ee;
  --grat: #c8d4e0;
  --land: #e9e6df;
  --land-edge: #c7c1b3;
  --union: #23427a;
  --union-ink: #ffffff;
  --union-edge: #f3f5f8;
  --new: #c4352b;
  --terr: #a7bfdc;
  --terr-new: #e7a49b;
  --sec: #6f7580;
  --gold: #876511;
  --progress: #23427a;
  --cost: #9b3b31;
  --focus: #d89b00;
  --shadow: 0 1px 2px rgb(22 33 51 / .06), 0 8px 24px rgb(22 33 51 / .08);

  --f-display: "Libre Caslon Display", "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-serif: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1522; --sheet: #121b2a; --ink: #e7ecf3; --ink-2: #a4afc1; --rule: #283449;
    --water: #0c1827; --grat: #1a2a3e; --land: #1f2735; --land-edge: #364257;
    --union: #5d86c8; --union-ink: #0b1220; --union-edge: #0e1522; --new: #ff6b5d;
    --terr: #39587f; --terr-new: #7a3b37; --sec: #8b919c; --gold: #d9b45d; --progress: #93b3e8; --cost: #f1958a;
    --focus: #f5c242; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1522; --sheet: #121b2a; --ink: #e7ecf3; --ink-2: #a4afc1; --rule: #283449;
  --water: #0c1827; --grat: #1a2a3e; --land: #1f2735; --land-edge: #364257;
  --union: #5d86c8; --union-ink: #0b1220; --union-edge: #0e1522; --new: #ff6b5d;
  --terr: #39587f; --terr-new: #7a3b37; --sec: #8b919c; --gold: #d9b45d; --progress: #93b3e8; --cost: #f1958a;
  --focus: #f5c242; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font: 16px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
a { color: inherit; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}

/* ---------- header ---------- */
.top {
  display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1 1 420px; }
.flag {
  flex: none; width: 80px; aspect-ratio: 19 / 10; border-radius: 2px; overflow: hidden;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 22%, transparent), 0 2px 6px rgb(0 0 0 / .12);
}
.flag svg { display: block; width: 100%; height: 100%; }
.flag.changed { animation: flagin .9s ease-out 1; }
@keyframes flagin { 0% { transform: scale(.82); opacity: .2; } 100% { transform: none; opacity: 1; } }
.brand-text { display: grid; gap: 4px; min-width: 0; }
.brand h1 {
  margin: 0; font: 400 26px/1.1 var(--f-display); letter-spacing: .005em; text-wrap: balance;
}
.brand p { margin: 0; color: var(--ink-2); font-size: 13.5px; letter-spacing: .01em; }
.brand p b { color: var(--ink); font-weight: 600; }
.stats { display: flex; gap: 6px 26px; margin: 0 0 0 auto; flex-wrap: wrap; }
.stats div { display: grid; gap: 0; min-width: 0; }
.stats dt { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-2); }
.stats dd { margin: 0; font: 400 21px/1.2 var(--f-serif); font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
.stats dd small { font: 400 12px var(--f-body); color: var(--ink-2); margin-left: 4px; }
.tools { display: flex; gap: 8px; }
.btn-quiet {
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px;
  padding: 6px 14px; font-size: 14px; cursor: pointer;
}
.btn-quiet:hover { border-color: var(--ink-2); }
.theme-btn { display: inline-flex; align-items: center; gap: 6px; padding-left: 11px; }
.theme-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- stage ---------- */
.stage { min-height: 0; display: grid; }
.mapwrap { position: relative; min-height: 0; background: var(--water); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }

/* map layers */
#map .water { fill: var(--water); }
#map .grat { fill: none; stroke: var(--grat); stroke-width: .6px; vector-effect: non-scaling-stroke; }
#map .land { fill: var(--land); stroke: var(--land-edge); stroke-width: .6px; vector-effect: non-scaling-stroke; }
#map .usland { fill: var(--land); }
#map .acq { fill: var(--terr); opacity: 0; transition: opacity .6s ease, fill .6s ease; }
#map .acq.on { opacity: 1; }
#map .acq.fresh { opacity: 1; fill: var(--terr-new); }
#map .acq-edge { fill: none; stroke: var(--new); stroke-width: 1.6px; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; opacity: 0; transition: opacity .6s; }
#map .acq-edge.fresh { opacity: 1; }
#map .st { fill: transparent; stroke: var(--land-edge); stroke-width: .7px; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; transition: fill .6s ease; cursor: pointer; }
#map .st.in { fill: var(--union); stroke: var(--union-edge); stroke-dasharray: none; stroke-width: .9px; }
#map .st.sec { fill: var(--sec); stroke: var(--union-edge); stroke-dasharray: none; stroke-width: .9px; }
#map .st.new { fill: var(--new); stroke: var(--union-edge); stroke-dasharray: none; stroke-width: 1.1px; }
#map .st:hover { filter: brightness(1.12); }
#map .st.new { animation: pulse 1.4s ease-out 1; }
@keyframes pulse { 0% { fill-opacity: .2; } 60% { fill-opacity: 1; } }
#map .inset-bg { fill: var(--water); }
#map [data-inset] { transition: opacity .6s ease; }
#map [data-inset].inset-off { opacity: 0; pointer-events: none; }
#map .inset { fill: none; stroke: var(--ink-2); stroke-width: .8px; vector-effect: non-scaling-stroke; stroke-dasharray: 3 3; }
#map text { font-family: var(--f-body); pointer-events: none; paint-order: stroke; }
#map .lbl { font-size: calc(var(--k, 1) * 11px); font-weight: 700; fill: var(--union-ink); text-anchor: middle; dominant-baseline: central; letter-spacing: .04em; opacity: 0; transition: opacity .4s; }
#map .lbl.show { opacity: .92; }
#map .lbl.call { fill: var(--ink); }
#map .lbl.newname { fill: var(--ink); stroke: var(--sheet); stroke-width: calc(var(--k, 1) * 3.5px); font-size: calc(var(--k, 1) * 13px); }
#map .leader { stroke: var(--ink-2); stroke-width: .7px; vector-effect: non-scaling-stroke; opacity: 0; transition: opacity .4s; }
#map .leader.show { opacity: .7; }
#map .geo-lbl { font-size: calc(var(--k, 1) * 11px); letter-spacing: .3em; fill: var(--ink-2); opacity: .75; text-anchor: middle; }
#map .geo-lbl.sea { font-style: italic; letter-spacing: .18em; }
#map .acq-lbl { font-family: var(--f-serif); font-style: italic; font-size: calc(var(--k, 1) * 14px); fill: var(--ink); stroke: var(--sheet); stroke-width: calc(var(--k, 1) * 4px); opacity: 0; transition: opacity .5s; }
#map #inset { transition: opacity .5s; }
#map .acq-lbl.show { opacity: 1; }
#map .inset-lbl { font-size: calc(var(--k, 1) * 10px); fill: var(--ink-2); letter-spacing: .08em; }
#pin circle.dot { fill: var(--ink); stroke: var(--sheet); stroke-width: 2px; vector-effect: non-scaling-stroke; }
#pin circle.ring { fill: none; stroke: var(--ink); stroke-width: 1.2px; vector-effect: non-scaling-stroke; opacity: .5; }
#pin text { font-size: 12.5px; font-weight: 700; fill: var(--ink); stroke: var(--sheet); stroke-width: 3.5px; stroke-linejoin: round; }

.mapcanvas { position: absolute; inset: 0; }
/* the milestone bar: year and title, centered at the top of the map */
.milestone {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5;
  display: flex; align-items: center; gap: 16px; max-width: min(760px, calc(100% - 420px));
  padding: 8px 22px 9px 18px; border-radius: 999px;
  background: color-mix(in srgb, var(--sheet) 92%, transparent); backdrop-filter: blur(6px);
  border: 1px solid var(--rule); box-shadow: 0 1px 2px rgb(22 33 51 / .06), 0 8px 24px rgb(22 33 51 / .12);
}
.milestone .yr { font: 400 40px/1 var(--f-display); letter-spacing: -.01em; color: var(--new); font-variant-numeric: lining-nums; flex: none; }
.milestone .ms-title { margin: 0; padding-left: 16px; border-left: 1px solid var(--rule); font: 400 21px/1.2 var(--f-display); color: var(--ink); text-wrap: balance; }

/* new-state entries inside the States panel */
.ycs { padding: 14px 0; }
.ycs:first-child { padding-top: 2px; }
.ycs:last-child { padding-bottom: 0; }
.ycs + .ycs { border-top: 1px dashed var(--rule); }
.ycs.note { font: italic 400 16px/1.45 var(--f-serif); color: var(--ink-2); }
.ycs-head { display: flex; align-items: center; gap: 13px; }
.ycs-flag { flex: none; width: 60px; height: 40px; object-fit: contain; filter: drop-shadow(0 1px 1px rgb(0 0 0 / .25)) drop-shadow(0 0 .6px rgb(0 0 0 / .5)); }
.ycs-name { margin: 0; font: 400 24px/1.1 var(--f-display); }
.ycs-ord { margin: 5px 0 0; font: 700 10.5px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--new); }
.ycs dl { margin: 12px 0 0; display: grid; gap: 8px; }
.ycs dl div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.ycs dt { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.ycs dd { margin: 0; font-size: 15px; line-height: 1.35; font-variant-numeric: tabular-nums; }
.ycs dd small { display: block; margin-top: 1px; font-size: 12.5px; color: var(--ink-2); }
.ycs.compact { padding: 11px 0; }
.ycs.compact .ycs-flag { width: 44px; height: 30px; }
.ycs.compact .ycs-name { font-size: 19px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ycs.compact .ycs-ord { margin: 0; }
.ycs-facts { margin: 3px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ycs-facts b { font-weight: 600; color: var(--ink); }

.legend {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 2;
  max-width: calc(100% - 28px); width: max-content;
  background: color-mix(in srgb, var(--sheet) 88%, transparent); backdrop-filter: blur(4px);
  border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; font-size: 12.5px;
}
.legend .row { display: flex; gap: 7px; align-items: center; white-space: nowrap; }
.legend .sw { width: 13px; height: 13px; border-radius: 3px; flex: none; border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
.legend .sw.in { background: var(--union); }
.legend .sw.new { background: var(--new); }
.legend .sw.terr { background: var(--terr); }
.legend .sw.sec { background: var(--sec); }
.legend .sw.out { background: var(--land); }
.legend .note { color: var(--ink-2); font-size: 11.5px; }

#tip {
  position: absolute; z-index: 5; pointer-events: none;
  background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px;
  padding: 8px 10px; font-size: 13.5px; line-height: 1.35; box-shadow: var(--shadow); max-width: 240px;
}
#tip b { font-family: var(--f-serif); font-size: 15px; }

/* ---------- story sections: a dock of buttons and the panels they open ---------- */
.reader {
  position: absolute; top: 14px; bottom: 64px; left: max(14px, env(safe-area-inset-left, 0px)); z-index: 4;
  display: flex; align-items: flex-start; gap: 12px; pointer-events: none;
}
.reader > * { pointer-events: auto; }
.dock { display: grid; gap: 6px; width: max-content; }
.sec-btn span { white-space: nowrap; }
.dock .dock-h { margin: 0 0 2px 4px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); text-shadow: 0 0 6px var(--water); }
.sec-btn {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 12px 7px 9px; cursor: pointer; text-align: left;
  border: 1px solid var(--rule); border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--ink);
  background: color-mix(in srgb, var(--sheet) 90%, transparent); backdrop-filter: blur(4px);
  box-shadow: 0 1px 2px rgb(22 33 51 / .06);
}
.sec-btn svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sec-btn:hover { border-color: var(--ink-2); }
.sec-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.sec-btn[aria-disabled="true"] { opacity: .45; }
.sec-btn .dot { width: 7px; height: 7px; border-radius: 50%; margin-left: auto; background: currentColor; opacity: 0; }
.sec-btn .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--new); color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.sec-btn .badge + .dot { margin-left: 6px; }
.sec-btn[aria-pressed="true"] .dot { opacity: 1; }

.panels {
  width: min(440px, 34vw); max-height: 100%; margin-top: 66px; overflow-y: auto; overscroll-behavior: contain;
  display: grid; gap: 12px; align-content: start; scroll-behavior: smooth;
}
.panels:empty { display: none; }
.panel {
  background: color-mix(in srgb, var(--sheet) 96%, transparent); backdrop-filter: blur(8px);
  border: 1px solid var(--rule); border-radius: 14px; padding: 14px 18px 18px;
  box-shadow: 0 1px 2px rgb(22 33 51 / .06), 0 10px 30px rgb(22 33 51 / .14);
  animation: panelin .25s ease-out;
}
@keyframes panelin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.panel-h { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.panel-h svg { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.panel-h h3 { margin: 0; font: 400 21px/1.15 var(--f-display); flex: 1; }
.panel-h .x {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--rule); background: var(--paper); cursor: pointer;
  display: grid; place-items: center; padding: 0; color: var(--ink-2); flex: none;
}
.panel-h .x:hover { color: var(--ink); border-color: var(--ink-2); }
.panel-h .x svg { width: 14px; height: 14px; }
.panel[data-sec="progress"] .panel-h { color: var(--progress); }
.panel[data-sec="promise"] .panel-h { color: var(--gold); }
.panel[data-sec="cost"] .panel-h { color: var(--cost); }
.panel[data-sec="fun"] .panel-h { color: var(--gold); }
.panel p { margin: 0; }
.panel .body { font-size: 16px; line-height: 1.6; }
.panel .when { margin: 0 0 6px; font: italic 400 15px var(--f-serif); color: var(--ink-2); }
.panel .empty { color: var(--ink-2); font-style: italic; }

figure.ill { margin: 0; }
figure.ill .frame { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; display: grid; place-items: center; }
figure.ill img { display: block; width: 100%; height: auto; max-height: 52vh; object-fit: contain; }
.fun-text { font-size: 17px; line-height: 1.55; }
figcaption, .credit { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; line-height: 1.45; }
figcaption i, .credit i { font-family: var(--f-serif); }
figcaption a, .credit a { text-underline-offset: 2px; }

ul.why { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 16px; line-height: 1.55; }
ul.why li { padding-left: 22px; position: relative; }
ul.why li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; border: 1.5px solid var(--ink-2); transform: rotate(45deg); }

.person .head { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; align-items: center; }
.person .portrait { width: 92px; height: 112px; border-radius: 6px; overflow: hidden; background: var(--rule); display: grid; place-items: center; font: 400 30px var(--f-display); color: var(--ink-2); }
.person .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
.person .name { font: 400 25px/1.1 var(--f-display); margin: 0; }
.person .life { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
.field { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; border: 1.5px solid currentColor; }
.field.Politics { color: var(--union); }
.field.Economy { color: var(--gold); }
.field.Science { color: var(--new); }
.field.Everyone { color: var(--ink-2); }
.person .did { margin-top: 14px; font-size: 16px; line-height: 1.6; }
.person .credit { margin-top: 10px; }

.ycs.land { display: flex; gap: 12px; align-items: center; font-size: 14.5px; }
.ycs.land .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; background: var(--terr-new); outline: 1.5px dashed var(--new); outline-offset: 1px; }
.ycs.land span { color: var(--ink-2); }
.ycs.land b { font-weight: 600; color: var(--ink); }

/* glossary terms */
.term {
  border: 0; background: none; padding: 0; margin: 0; cursor: help; color: inherit; font: inherit;
  text-decoration: underline dotted color-mix(in srgb, var(--ink) 55%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 3px;
}
.term:hover, .term[aria-expanded="true"] { text-decoration-color: var(--new); color: var(--new); }
#pop {
  position: fixed; z-index: 30; max-width: 280px; background: var(--ink); color: var(--paper);
  border-radius: 8px; padding: 10px 12px; font-size: 14.5px; line-height: 1.45; box-shadow: var(--shadow);
}
#pop b { display: block; font: 400 17px var(--f-serif); margin-bottom: 2px; }

/* ---------- timeline ---------- */
.timeline {
  border-top: 1px solid var(--rule); background: var(--sheet);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
  padding-block: 10px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tl-btns { display: flex; gap: 6px; }
.round {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule); background: var(--paper);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.round:hover { border-color: var(--ink-2); }
.round svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.round.play svg { fill: currentColor; stroke: none; }
.track { position: relative; height: 70px; --thumb: 22px; min-width: 0; }
.eras { position: absolute; left: 0; right: 0; top: 0; height: 18px; }
.era-band { position: absolute; top: 0; height: 18px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 1px solid var(--rule); padding-left: 6px; line-height: 18px; }
.era-band.cur { color: var(--new); font-weight: 700; }
.ticks { position: absolute; left: 0; right: 0; top: 30px; height: 14px; pointer-events: none; }
.rail { position: absolute; left: calc(var(--thumb) / 2); right: calc(var(--thumb) / 2); top: 36px; height: 2px; background: var(--rule); border-radius: 2px; }
.rail .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--union); border-radius: 2px; transition: width .3s; }
.tick { position: absolute; top: 2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--rule); }
.tick.state { border-color: var(--union); }
.tick.past { background: var(--union); border-color: var(--union); }
.tick.past:not(.state) { background: var(--ink-2); border-color: var(--ink-2); }
.tick:not(.state) { width: 8px; height: 8px; margin-left: -4px; top: 3px; border-radius: 1px; transform: rotate(45deg); }
.ylabels { position: absolute; left: 0; right: 0; top: 50px; height: 18px; pointer-events: none; }
.ylabel { position: absolute; transform: translateX(-50%); font: 400 13px var(--f-serif); color: var(--ink-2); font-variant-numeric: lining-nums tabular-nums; }
#slider {
  position: absolute; left: 0; right: 0; top: 24px; width: 100%; height: 26px; margin: 0;
  -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer;
}
#slider::-webkit-slider-runnable-track { height: 26px; background: transparent; }
#slider::-moz-range-track { height: 26px; background: transparent; }
#slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: var(--thumb); height: var(--thumb); margin-top: 2px; border-radius: 50%;
  background: var(--new); border: 3px solid var(--sheet); box-shadow: 0 0 0 1.5px var(--new), var(--shadow);
}
#slider::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; background: var(--new); border: 3px solid var(--sheet); box-shadow: 0 0 0 1.5px var(--new);
}
#slider:focus-visible { outline: none; }
#slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--focus); }
#slider:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px var(--focus); }
.bubble {
  position: absolute; top: 50px; transform: translateX(-50%); z-index: 1;
  font: 700 14px var(--f-serif); color: var(--paper); background: var(--new); border-radius: 5px; padding: 0 7px; line-height: 19px; pointer-events: none;
  font-variant-numeric: tabular-nums;
}

/* ---------- overlays ---------- */
.sheet-overlay { position: fixed; inset: 0; z-index: 40; background: rgb(10 16 26 / .45); display: grid; place-items: center; padding: 16px; }
.sheet-panel {
  background: var(--sheet); color: var(--ink); border-radius: 14px; box-shadow: var(--shadow);
  width: min(760px, 100%); max-height: min(84vh, 900px); overflow: auto;
  padding-block: 22px 26px; padding-inline: 26px;
}
.sheet-panel h2 { font: 400 30px var(--f-display); margin: 0 0 4px; }
.sheet-panel .close { float: right; }
.sheet-panel dl { display: grid; grid-template-columns: minmax(120px, 180px) minmax(0, 1fr); gap: 10px 18px; margin: 18px 0 0; }
.sheet-panel dt { font: 700 15px var(--f-body); }
.sheet-panel dd { margin: 0; color: var(--ink-2); }
.sheet-panel h3 { font: 700 12px var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); margin: 24px 0 8px; }
.sheet-panel p, .sheet-panel li { color: var(--ink-2); font-size: 14.5px; }
.sheet-panel ol { padding-left: 20px; display: grid; gap: 6px; }

/* ---------- responsive ---------- */
@media (max-width: 960px) {
  html, body { height: auto; }
  .app { height: auto; display: block; }
  .stage { display: block; }
  .mapwrap { overflow: visible; display: flex; flex-direction: column; }
  .mapcanvas { order: 1; position: relative; inset: auto; aspect-ratio: 17 / 10; max-width: 100%; overflow: hidden; }
  .legend { order: 2; position: static; transform: none; width: auto; max-width: none; border-radius: 0; border-width: 0 0 1px; backdrop-filter: none; background: var(--sheet); justify-content: flex-start; padding: 8px 16px; font-size: 11.5px; }
  .milestone { order: 0; position: static; transform: none; max-width: none; border-radius: 0; border-width: 0 0 1px; box-shadow: none; backdrop-filter: none; background: var(--sheet); padding: 10px 16px; gap: 12px; }
  .milestone .yr { font-size: 32px; }
  .milestone .ms-title { font-size: 18px; padding-left: 12px; }
  .reader { order: 4; position: static; display: block; pointer-events: auto; }
  .dock { width: auto; display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; background: var(--paper); border-bottom: 1px solid var(--rule); scrollbar-width: none; }
  .dock .dock-h { display: none; }
  .sec-btn { width: auto; flex: none; backdrop-filter: none; background: var(--sheet); }
  .panels { width: auto; max-height: none; margin-top: 0; overflow: visible; padding: 12px 16px 24px; background: var(--paper); }
  .panel { backdrop-filter: none; background: var(--sheet); box-shadow: none; }
  .timeline { position: sticky; bottom: 0; z-index: 20; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 20px rgb(0 0 0 / .06); }
  .stats { margin-left: 0; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stats dd { font-size: 18px; }
  .stats dd small { display: block; margin: 0; }
  .tools { width: 100%; justify-content: flex-end; order: -1; margin-bottom: -4px; }
  .top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand { flex-basis: 100%; align-items: flex-start; }
  .brand h1 { font-size: 21px; }
  .flag { width: 60px; margin-top: 3px; }
}
@media (max-width: 560px) {
  .era-band { font-size: 0; }
  .era-band::first-letter { font-size: 11px; }
  .tl-btns .play-wrap { display: none; }
  .ylabel:not(.edge) { display: none; }
  .tick { width: 6px; height: 6px; margin-left: -3px; top: 4px; border-width: 1.5px; }
  .tick:not(.state) { width: 5px; height: 5px; margin-left: -2.5px; top: 4.5px; }
  .track { --thumb: 18px; }
  #slider::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: 4px; }
  .person .head { grid-template-columns: 72px minmax(0, 1fr); }
  .person .portrait { width: 72px; height: 88px; }
  .sheet-panel dl { grid-template-columns: 1fr; gap: 2px 0; }
  .sheet-panel dd { margin-bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

<script>
const DATA = {"stops":[{"id":"1776","date":"1776-07-04","when":"July 4, 1776","label":"1776","fun":"John Adams and Thomas Jefferson both helped create the Declaration. Both men died on the same day: July 4, 1826, exactly 50 years later.","title":"Thirteen colonies declare independence","states":["DE","PA","NJ","GA","CT","MA","MD","SC","NH","VA","NY","NC","RI"],"statesNote":"The 13 original states","place":{"name":"Philadelphia","lon":-75.15,"lat":39.95},"what":"Leaders from 13 British [[colonies|colony]] met in Philadelphia. On July 4, 1776, they approved the Declaration of [[Independence]]. It said the colonies were now free and independent states. The war with Britain had already started in 1775.","why":["Britain taxed the colonies, but colonists had no vote in the British Parliament. Their slogan was “No taxation without representation.”","Fighting began at Lexington and Concord, Massachusetts, in April 1775.","Thomas Paine’s booklet \u003ci>Common Sense\u003c/i> (January 1776) convinced many colonists that they did not need a king."],"person":{"name":"Thomas Jefferson","life":"1743–1826","field":"Politics","role":"Author of the Declaration of Independence; later the 3rd president","did":"Jefferson was 33 years old when he wrote the first draft. Congress changed parts of it, but his most famous words stayed: “all men are created equal,” with rights to “Life, Liberty and the pursuit of Happiness.”"},"progress":"For the first time, a group of colonies said that a government gets its power from the people it governs: “the consent of the governed.”","promise":"“All men are created equal” became a promise. Later Americans, including enslaved people, women, and immigrants, used these words to demand their own rights.","cost":"About one in five people in the colonies was [[enslaved]]. Jefferson himself enslaved more than 600 people during his life.","also":"The main fighting ended in 1781, when a large British army surrendered at Yorktown, Virginia. The war officially ended in 1783.","placeXY":[701.8,471.5]},{"id":"1783","date":"1783-09-03","when":"September 3, 1783","label":"1783","fun":"Benjamin West never finished his painting of the peace talks. The British negotiators would not pose for it, so the right side of the canvas is still empty.","title":"Britain recognizes the United States","states":[],"acq":"a1783","place":null,"what":"In Paris, the United States and Great Britain signed a peace [[treaty]]. Britain accepted American independence. The new country now reached west to the Mississippi River, north to the Great Lakes, and south to Spanish Florida.","why":["American and French forces defeated the main British army at Yorktown in 1781.","France and Spain helped the Americans with soldiers, ships, and money.","Britain’s government decided that the long war cost too much."],"person":{"name":"Benjamin Franklin","life":"1706–1790","field":"Science","role":"Scientist, inventor, and diplomat","did":"Franklin was famous around the world for his experiments with electricity. His fame helped him win France as an ally in 1778. In Paris, he worked with John Adams and John Jay to make the peace treaty."},"progress":"The treaty gave the new country about 890,000 square miles. This included the huge region between the Appalachian Mountains and the Mississippi River.","promise":"The states later gave their western land claims to the national government. That land would become new states, equal to the original thirteen.","cost":"No Native nations were part of the treaty. Britain gave away land where the Shawnee, Miami, Cherokee, Creek, and many other peoples lived, without asking them.","also":"In 1785, Congress divided western land into square [[townships|township]], six miles on each side. You can still see this grid from an airplane today.","placeXY":null},{"id":"1787","date":"1787-12-18","when":"September–December 1787","label":"1787","fun":"Benjamin Franklin, 81, was the oldest man to sign the Constitution. The youngest, Jonathan Dayton of New Jersey, was only 26.","title":"A new Constitution, and the first states say yes","states":["DE","PA","NJ"],"statesNote":"First to ratify the Constitution","place":{"name":"Philadelphia","lon":-75.15,"lat":39.95},"what":"In the summer of 1787, [[delegates|delegate]] met in Philadelphia and wrote a new plan of government: the [[Constitution]]. They signed it on September 17. Then each state had to [[ratify]] it. Delaware voted yes first, on December 7. Pennsylvania and New Jersey followed that same month.","why":["The first plan, the Articles of Confederation, made the national government too weak. It could not collect taxes or control trade between the states.","In 1786–87, angry farmers in Massachusetts rose up in Shays’ Rebellion. Many leaders feared the young country could fall apart.","Small states like Delaware liked that every state would have two senators, no matter its size."],"person":{"name":"James Madison","life":"1751–1836","field":"Politics","role":"“Father of the Constitution”; later the 4th president","did":"Madison studied the history of governments for months before the meeting. His Virginia Plan gave the delegates their starting point. His notes are the best record we have of the debates."},"progress":"The Constitution created three branches that check and balance each other: Congress makes laws, the President carries them out, and the courts judge them.","promise":"It begins with the words “We the People.” It also gives a way to change it, through [[amendments|amendment]], so later generations could improve it.","cost":"To keep the Southern states, the Constitution counted each enslaved person as three-fifths of a person when giving out seats in Congress. It also protected the slave trade until 1808.","also":"In July 1787, Congress passed the Northwest Ordinance. It said new territories could become states equal to the old ones, and it banned slavery north of the Ohio River.","placeXY":[701.8,471.5]},{"id":"1788","date":"1788-07-26","when":"January–July 1788","label":"1788","fun":"The \u003ci>Federalist\u003c/i> essays were signed with a fake name, “Publius.” For years, readers did not know for sure that Hamilton, Madison and Jay had written them.","title":"Nine states make it law","states":["GA","CT","MA","MD","SC","NH","VA","NY"],"statesNote":"Ratified the Constitution","place":{"name":"Concord, New Hampshire","lon":-71.54,"lat":43.21},"what":"In 1788, eight more states ratified the Constitution. When New Hampshire became the ninth on June 21, the Constitution officially took effect. Virginia, a large and powerful state, joined four days later, and New York a month after that.","why":["The Constitution needed nine of the thirteen states to start.","Supporters, called Federalists, wrote newspaper essays to explain the plan. Opponents, the Anti-Federalists, feared a strong central government.","Several states, including Massachusetts, Virginia, and New York, said yes only after supporters promised to add a list of rights."],"person":{"name":"Alexander Hamilton","life":"c. 1755–1804","field":"Economy","role":"Founder of America’s financial system","did":"Hamilton, an immigrant from the Caribbean island of Nevis, wrote 51 of the 85 \u003ci>Federalist\u003c/i> essays defending the Constitution. At New York’s meeting, he helped win a close yes vote, 30 to 27. Later, as the first Treasury Secretary, he built the nation’s banking and credit system."},"progress":"The states now shared one national government, one army, one currency, and free trade among themselves.","promise":"The debate itself was a promise kept. Citizens argued in newspapers and town meetings, then voted. A big change came through words and votes, not force.","cost":"Most people had no voice in the decision. In most states, only men who owned property or paid taxes could vote, and almost all of them were white.","also":"The first elections for Congress and President took place from December 1788 to January 1789.","placeXY":[721.8,418.8]},{"id":"1789","date":"1790-05-29","when":"1789–1790","label":"1789","fun":"George Washington’s second inaugural speech, in 1793, was only 135 words long. It is still the shortest in U.S. history.","title":"A president, a Bill of Rights, and the last two states","states":["NC","RI"],"statesNote":"Ratified the Constitution","place":{"name":"New York City","lon":-74.01,"lat":40.71},"what":"On April 30, 1789, George Washington became the first President, in New York City, the first capital. That fall, Congress proposed the [[Bill of Rights]]. North Carolina ratified the Constitution in November 1789, and Rhode Island in May 1790. All thirteen states were now under the Constitution.","why":["North Carolina and Rhode Island waited until they were sure a Bill of Rights was coming.","Rhode Island also faced pressure: Congress was ready to treat it like a foreign country and tax its trade.","Washington’s leadership in the war gave people trust in the new government."],"person":{"name":"George Washington","life":"1732–1799","field":"Politics","role":"Commander of the army in the Revolution; 1st president","did":"Washington led the army through eight years of war, then gave up his command and went home instead of seeking power. He was elected President [[unanimously|unanimous]]. He set customs that still guide the country, such as the [[Cabinet]], and he chose to retire after two terms."},"progress":"The Bill of Rights, the first ten amendments, was ratified in 1791. It protects freedom of speech, religion, and the press, and the right to a fair trial.","promise":"The Bill of Rights protects people against government power. Over time, courts and new amendments gave these protections to more and more Americans.","cost":"Washington enslaved people at his Mount Vernon farm all his life. In his will, he ordered that the 123 people he owned be freed.","also":"The first [[census]] in 1790 counted 3.9 million people, including almost 700,000 enslaved people.","placeXY":[709.6,458.4]},{"id":"1791","date":"1791-03-04","when":"March 4, 1791","label":"1791","fun":"As an independent republic, Vermont ran its own post office and even made its own copper coins.","title":"Vermont, the first new state","states":["VT"],"place":{"name":"Bennington","lon":-73.2,"lat":42.88},"what":"Vermont became the 14th state, the first one added after the original thirteen. For 14 years before that, Vermont had governed itself as an independent republic.","why":["New York and New Hampshire both claimed Vermont’s land. Settlers there refused to accept New York’s rule.","In 1790, Vermont agreed to pay New York $30,000 to end the land dispute.","Northern leaders wanted a new free state. Kentucky, where slavery was legal, was planned to join next."],"person":{"name":"Thomas Chittenden","life":"1730–1797","field":"Politics","role":"Leader of the Vermont Republic; first governor of the state","did":"Chittenden led independent Vermont for most of its 14 years. He guided the long talks with New York and Congress that brought Vermont into the Union, and he became its first state governor."},"progress":"Vermont proved that the Union could grow. New states could join as full equals to the original thirteen.","promise":"Vermont’s 1777 constitution was the first in America to ban adult slavery. It also let men vote without owning property.","cost":"The Abenaki people had lived in the region for thousands of years. They were not part of these agreements and lost much of their land.","also":"In 1791, Benjamin Banneker, a free Black scientist, helped measure the land for the new capital city, Washington, D.C.","placeXY":[708.3,427.9]},{"id":"1792","date":"1792-06-01","when":"June 1, 1792","label":"1792","fun":"The two presidents of the Civil War, Abraham Lincoln and Jefferson Davis, were both born in Kentucky, less than a year apart.","title":"Kentucky: the first state beyond the mountains","states":["KY"],"place":{"name":"Cumberland Gap","lon":-83.67,"lat":36.6},"what":"Kentucky became the 15th state. It was the first state west of the Appalachian Mountains. Before this, it was part of Virginia.","why":["Thousands of settlers crossed the mountains through the Cumberland Gap to find rich farmland.","Kentucky was far from Virginia’s capital. Settlers wanted their own government to protect them and build roads.","Virginia agreed to let Kentucky separate."],"person":{"name":"Daniel Boone","life":"1734–1820","field":"Economy","role":"[[Pioneer]], hunter, and land surveyor","did":"In 1775, a land company hired Boone to open a route west. He and about 30 men cut the Wilderness Road through the Cumberland Gap. It became one of the main roads west for tens of thousands of families."},"progress":"Settlement spread beyond the mountains. The Ohio River became a highway for farm goods going to market.","promise":"Kentucky showed that the West would be part of the nation, with its own voice in Congress.","cost":"Kentucky was hunting land for the Shawnee and Cherokee, who fought hard to keep it. Kentucky also allowed slavery from its first day as a state.","also":"In 1793, Eli Whitney invented the cotton gin, a machine that would change the South (see 1817).","placeXY":[627.9,535.9]},{"id":"1796","date":"1796-06-01","when":"June 1, 1796","label":"1796","fun":"Tennessee is called “the Volunteer State” because thousands of its men volunteered to fight in the War of 1812.","title":"Tennessee shows the way to statehood","states":["TN"],"place":{"name":"Knoxville","lon":-83.92,"lat":35.96},"what":"Tennessee became the 16th state. It was the first state made from a federal [[territory]]: the “Southwest Territory,” land that North Carolina had given to the national government.","why":["A count in 1795 found over 77,000 people, more than enough for statehood.","Tennesseans wrote a constitution and asked Congress to admit them, without waiting for Congress to act first. Later territories copied this “Tennessee Plan.”","Settlers wanted protection and a voice in national politics."],"person":{"name":"John Sevier","life":"1745–1815","field":"Politics","role":"Frontier leader; first governor of Tennessee","did":"Sevier was a hero of the Battle of Kings Mountain in 1780. In the 1780s he led the short-lived “State of Franklin,” an early attempt to make the region a state. When Tennessee joined the Union, he became its first governor."},"progress":"The “Tennessee Plan” gave future territories a clear path: grow, write a constitution, and ask to join.","promise":"Tennessee’s first constitution let free men vote without owning property, including free Black men. The state took that right away from Black men in 1834.","cost":"Settlement pushed onto Cherokee and Chickasaw land, often breaking earlier treaties.","also":"A young lawyer named Andrew Jackson helped write Tennessee’s constitution and became its first member of the U.S. House.","placeXY":[626.9,544.9]},{"id":"1803","date":"1803-04-30","when":"March–April 1803","label":"1803","fun":"In 1803, Congress accepted Ohio as a state, but it never passed a formal resolution admitting it. In 1953, for Ohio’s 150th birthday, Congress passed one, dating statehood back to March 1, 1803.","title":"Ohio joins, and the country doubles in size","states":["OH"],"acq":"a1803","place":{"name":"New Orleans","lon":-90.07,"lat":29.95},"what":"On March 1, 1803, Ohio became the 17th state, the first from the Northwest Territory. On April 30, the United States agreed to buy the huge Louisiana Territory from France for $15 million. The country almost doubled in size.","why":["Western farmers sent their crops down the Mississippi River. Whoever controlled New Orleans controlled their trade.","France needed money for war in Europe, and its army had been defeated by the revolution in Haiti. Napoleon decided to sell all of Louisiana.","Ohio followed the Northwest Ordinance: when enough people lived there, it could become a state."],"person":{"name":"Robert R. Livingston","life":"1746–1813","field":"Politics","role":"U.S. minister to France; negotiated the Louisiana Purchase","did":"President Jefferson told Livingston, and later James Monroe, to try to buy New Orleans and West Florida. When France offered all of Louisiana instead, they said yes. Livingston said: “We have lived long, but this is the noblest work of our whole lives.”"},"progress":"The Purchase added about 827,000 square miles (2.1 million km²). Americans now controlled the whole Mississippi River and the port of New Orleans.","promise":"Jefferson dreamed of a nation of independent farm families. All or part of 15 future states came from this land.","cost":"France sold land it did not really control. Dozens of Native nations, such as the Osage, Lakota, and Pawnee, lived there. The U.S. bought France’s claim, then spent the next century taking the land through treaties and wars.","also":"Jefferson asked Meriwether Lewis and William Clark to explore the new land.","placeXY":[571.8,634.5]},{"id":"1805","date":"1805-11-15","when":"November 1805","label":"1805","fun":"The expedition had a dog. Seaman, Meriwether Lewis’s big Newfoundland, traveled with the explorers all the way to the Pacific.","title":"Lewis and Clark reach the Pacific","states":[],"place":{"name":"Mouth of the Columbia River","lon":-123.95,"lat":46.25},"what":"In May 1804, the Corps of Discovery left the St. Louis area to explore the Louisiana Purchase and find a way to the Pacific Ocean. In November 1805, after about 4,000 miles, they reached the Pacific coast. They came back in 1806 with maps, journals, and notes on about 300 plants and animals new to science.","why":["Jefferson wanted to know what the United States had bought.","He hoped to find a water route across the continent for trade.","Exploring the Pacific Northwest supported an American claim to the Oregon Country."],"person":{"name":"Sacagawea","life":"c. 1788–1812","field":"Science","role":"Lemhi Shoshone guide and [[interpreter]]","did":"Sacagawea joined the [[expedition]] as a teenager with a baby son. She helped the team get horses from her own Shoshone people and found food plants. Her presence also showed other Native nations that the group came in peace: a war party would not travel with a woman and a baby."},"progress":"The expedition’s maps and science opened the West to the American imagination, and to the traders and settlers who followed.","promise":"The journey succeeded because many different people worked together: soldiers, a Shoshone woman, a French-Canadian interpreter, an enslaved Black man named York, and the many Native nations who helped them.","cost":"The journey also began a century of change for Native nations. Traders, settlers, and soldiers soon followed the explorers’ path.","also":"In 1807, Robert Fulton’s steamboat traveled up the Hudson River from New York City to Albany in about 32 hours.","placeXY":[246.2,391.5]},{"id":"1812","date":"1812-04-30","when":"April 30, 1812","label":"1812","fun":"Louisiana has no counties. Its local areas are called “parishes,” a name from its French and Spanish Catholic past.","title":"Louisiana: gateway to the Mississippi","states":["LA"],"place":{"name":"New Orleans","lon":-90.07,"lat":29.95},"what":"Exactly nine years after the Louisiana Purchase, Louisiana became the 18th state, the first made from the Purchase. Its main city, New Orleans, was already one of the busiest ports in North America.","why":["New Orleans was the door to the sea for every farm along the Mississippi and Ohio Rivers.","About 77,000 people lived in the territory in 1810, enough for statehood.","Its people mixed French, Spanish, African, Caribbean, and American cultures."],"person":{"name":"Robert Fulton","life":"1765–1815","field":"Science","role":"Engineer and steamboat builder","did":"Fulton built the first successful commercial steamboat in 1807. His company’s boat, the \u003ci>New Orleans\u003c/i>, reached New Orleans in January 1812, the first steamboat on the Mississippi. Steamboats could travel upriver against the current, so the river became a two-way highway."},"progress":"Steam power made river trade faster and cheaper. Within a few decades, hundreds of steamboats carried goods and people on western rivers.","promise":"Louisiana kept its French-style legal system, called civil law. New states could keep their own traditions inside the Union.","cost":"Louisiana’s sugar and cotton farms depended on enslaved workers. In 1811, the German Coast Uprising, the largest slave revolt in U.S. history, was crushed near New Orleans.","also":"In June 1812, the U.S. declared war on Britain. The last big battle of the War of 1812 was Andrew Jackson’s victory at New Orleans in January 1815.","placeXY":[571.8,634.5]},{"id":"1816","date":"1816-12-11","when":"December 11, 1816","label":"1816","fun":"People from Indiana are called “Hoosiers,” but no one knows for sure where the word comes from.","title":"Indiana, “land of the Indians”","states":["IN"],"place":{"name":"Corydon","lon":-86.12,"lat":38.21},"what":"Indiana became the 19th state. Its name means “land of the Indians.” Its first capital was the small town of Corydon. In the summer heat, delegates wrote parts of the state constitution in the shade of a big elm tree.","why":["After the War of 1812, settlers moved into the Ohio Valley in large numbers.","Native resistance in the region had been broken at the Battle of Tippecanoe (1811) and in the War of 1812.","Under the Northwest Ordinance, Indiana had to ban slavery, and its constitution did."],"person":{"name":"William Henry Harrison","life":"1773–1841","field":"Politics","role":"Governor of Indiana Territory; later the 9th president","did":"As territorial governor from 1801 to 1812, Harrison made treaties that moved millions of acres of Native land to the United States. This opened Indiana to settlers. He led U.S. troops at Tippecanoe in 1811."},"progress":"Indiana’s first constitution called for free public schools “equally open to all,” one of the earliest such promises in the country.","promise":"In 1816, young Abraham Lincoln moved to Indiana with his family. Cheap land in a free state gave poor families like his a chance.","cost":"The Shawnee leader Tecumseh tried to unite Native nations to stop the loss of their land. He died in battle in 1813. Many Native communities were later forced to move west.","also":"Construction of the Erie Canal in New York began on July 4, 1817 (see 1837).","placeXY":[599.2,518.8]},{"id":"1817","date":"1817-12-10","when":"December 10, 1817","label":"1817","fun":"The name Mississippi comes from the Ojibwe words for “great river.”","title":"Mississippi and the cotton boom","states":["MS"],"place":{"name":"Natchez","lon":-91.4,"lat":31.56},"what":"Mississippi became the 20th state. Rich soil along the river and world demand for cotton brought thousands of settlers, and thousands of enslaved people, into the region.","why":["Factories in Britain and New England needed huge amounts of cotton to make cloth.","The cotton gin made it fast and cheap to clean cotton, so growing it became very profitable.","Natchez, on the Mississippi River, was the center of trade."],"person":{"name":"Eli Whitney","life":"1765–1825","field":"Science","role":"Inventor of the cotton gin","did":"In 1793, Whitney built a simple machine that pulled cotton fibers away from the seeds. One worker with a gin could clean about 50 pounds of cotton a day. By hand, a worker could clean only a pound or a few pounds. Cotton farming exploded across the South."},"progress":"Cotton became America’s most valuable export. By 1840, it was worth more than all other U.S. exports combined.","promise":"Whitney also promoted “interchangeable parts,” identical pieces that fit any copy of a machine. This idea is at the heart of modern factories.","cost":"The cotton gin did not reduce slavery; it increased it. The number of enslaved people grew from about 700,000 in 1790 to nearly 4 million in 1860. About one million were forced from the Upper South to the Deep South.","also":"In 1817, President James Monroe toured the country. A newspaper called the new mood of national unity the “Era of Good Feelings.”","placeXY":[554.5,614.8]},{"id":"1818","date":"1818-12-03","when":"December 3, 1818","label":"1818","fun":"The name Chicago comes from a Native word, \u003ci>shikaakwa\u003c/i>, for a wild onion that grew near the lake.","title":"Illinois, and a border that reached Chicago","states":["IL"],"place":{"name":"Chicago","lon":-87.63,"lat":41.88},"what":"Illinois became the 21st state. The first plan put its northern border at the bottom of Lake Michigan. Congress moved the line about 60 miles north. This gave Illinois a shore on the lake, at the spot that became Chicago.","why":["Illinois needed 40,000 people for statehood. The count was very close, and some people may have been counted twice.","Leaders wanted Illinois linked to the Great Lakes, not only to Southern rivers, so it would be tied to the North.","Rich prairie land attracted farmers from the East and the South."],"person":{"name":"Nathaniel Pope","life":"1784–1850","field":"Politics","role":"Illinois Territory’s [[delegate]] to Congress","did":"Pope wrote the law that made Illinois a state. He added a change that moved the northern border to 42°30′ north. He argued that a port on Lake Michigan would bind Illinois to the Union. Without him, Chicago would be in Wisconsin."},"progress":"Chicago grew from a small fort into one of the world’s largest cities by 1890, a center for railroads, grain, and industry.","promise":"The trading post at Chicago was started in the 1780s by Jean Baptiste Point du Sable, a Black man of African and French descent. He is honored today as Chicago’s founder.","cost":"Illinois banned slavery on paper, but its “Black Laws” limited the rights of free Black people, and some forced labor continued for years.","also":"In October 1818, the U.S. and Britain agreed that the 49th parallel would be the border from Minnesota to the Rocky Mountains.","placeXY":[576.9,471.8]},{"id":"1819","date":"1819-12-14","when":"February–December 1819","label":"1819","fun":"St. Augustine, Florida, founded by Spain in 1565, is the oldest European-founded city in the continental United States that has been lived in without a break.","title":"Alabama joins, and Spain gives up Florida","states":["AL"],"acq":"a1819","place":{"name":"Huntsville","lon":-86.59,"lat":34.73},"what":"On February 22, 1819, Spain agreed to give Florida to the United States in the Adams–Onís Treaty. The treaty also drew a border between U.S. and Spanish lands all the way to the Pacific. On December 14, Alabama became the 22nd state.","why":["Spain could no longer defend Florida. In 1818, General Andrew Jackson had invaded Spanish Florida while fighting the Seminole.","Alabama’s rich dark soil, the “Black Belt,” was perfect for cotton. Settlers rushed in.","After the Creek War of 1813–14, the Creek Nation was forced to give up about 23 million acres in Alabama and Georgia."],"person":{"name":"John Quincy Adams","life":"1767–1848","field":"Politics","role":"Secretary of State; later the 6th president","did":"Adams negotiated the treaty with Spain’s minister, Luis de Onís. He won Florida and a border across the continent, the first clear U.S. claim reaching the Pacific Ocean."},"progress":"The U.S. now controlled the whole Gulf Coast from Florida to Louisiana.","promise":"Later, as a congressman, Adams fought for eight years against a rule that blocked anti-slavery petitions, and he won. He defended the right of every citizen to be heard.","cost":"Florida was home to the Seminole people, including many Black people who had escaped slavery. The U.S. Army fought three Seminole Wars (1817–1858) to force them out.","also":"In 1819, the country’s first major financial crisis, the Panic of 1819, caused banks to fail and many people to lose their farms.","placeXY":[601.6,566]},{"id":"1820","date":"1821-08-10","when":"1820–1821","label":"1820","fun":"Maine is the only state whose name has just one syllable.","title":"The Missouri Compromise: Maine and Missouri","states":["ME","MO"],"place":{"name":"St. Louis","lon":-90.2,"lat":38.63},"what":"Missouri asked to join as a state that allowed slavery, and Congress argued bitterly. The answer was the Missouri [[Compromise]]. Maine, once part of Massachusetts, joined as a free state on March 15, 1820. Missouri joined as a slave state on August 10, 1821. Slavery was banned in the rest of the Louisiana Purchase north of the line 36°30′.","why":["There were 11 free states and 11 slave states. Adding Missouri alone would break the balance in the Senate.","People in Maine had long wanted to separate from Massachusetts.","Leaders feared the fight over slavery could break the Union apart."],"person":{"name":"Henry Clay","life":"1777–1852","field":"Politics","role":"Speaker of the House; “the Great Compromiser”","did":"Clay pushed the compromise through Congress. In 1821, he worked out a second deal when Missouri’s constitution tried to keep free Black people out of the state."},"progress":"St. Louis became the “Gateway to the West,” where traders and settlers began their journeys west.","promise":"The compromise kept the peace for over 30 years. It showed that Congress could solve hard problems by give and take.","cost":"The peace was fragile. Thomas Jefferson called the crisis “a fire bell in the night,” a warning that slavery could destroy the Union.","also":"In 1821, Mexico won independence from Spain, and the Santa Fe Trail opened trade between Missouri and Mexico’s northern lands.","placeXY":[557.3,518.8]},{"id":"1836","date":"1836-06-15","when":"June 15, 1836","label":"1836","fun":"In 1881, Arkansas lawmakers passed a resolution on how to say the state’s name: “AR-kan-saw,” with a silent s.","title":"Arkansas, along the Trail of Tears","states":["AR"],"place":{"name":"Little Rock","lon":-92.29,"lat":34.75},"what":"Arkansas became the 25th state. In the same years, the U.S. government forced tens of thousands of Native Americans from their homes in the Southeast to “Indian Territory” (today’s Oklahoma). Many of their routes, later called the Trail of Tears, passed through Arkansas.","why":["Arkansas joined as a slave state, paired with Michigan, a free state, to keep the balance in Congress.","Cotton farms were spreading along Arkansas’s rivers.","Settlers and the government wanted Native land in the Southeast for farms, and for gold found in Georgia in 1829."],"person":{"name":"Andrew Jackson","life":"1767–1845","field":"Politics","role":"7th president (1829–1837)","did":"Jackson was a hero to many white settlers, and he signed the law that made Arkansas a state. He also pushed the Indian Removal Act of 1830 through Congress. When the Supreme Court ruled in 1832 that Georgia had no power over the Cherokee Nation, Jackson did not enforce the ruling."},"progress":"In Jackson’s time, voting spread to almost all white men, and ordinary people became more active in politics.","promise":"The Cherokee fought removal peacefully, with their own newspaper, petitions, and a lawsuit, and they won in the Supreme Court. Their struggle is part of America’s long fight for justice.","cost":"About 100,000 Native people were forced west in the 1830s and 1840s. On the Cherokee journey of 1838–39 alone, about 4,000 people died.","also":"In March 1836, Texas declared independence from Mexico. After the Alamo fell, Texans won the Battle of San Jacinto in April.","placeXY":[540.8,573.1]},{"id":"1837","date":"1837-01-26","when":"January 26, 1837","label":"1837","fun":"Michigan touches four of the five Great Lakes. It has more freshwater shoreline than any other state.","title":"Michigan and the Erie Canal boom","states":["MI"],"place":{"name":"Detroit","lon":-83.05,"lat":42.33},"what":"Michigan became the 26th state. Its population grew from about 9,000 in 1820 to about 175,000 in 1837, thanks to a new water highway: the Erie Canal.","why":["The Erie Canal (1825) connected New York City to the Great Lakes. Settlers could now travel west cheaply by boat.","Michigan and Ohio almost fought over the city of Toledo, the “Toledo War.” Michigan gave up Toledo and got the Upper Peninsula instead.","Congress paired Michigan (free) with Arkansas (slave) to keep the Senate balanced."],"person":{"name":"DeWitt Clinton","life":"1769–1828","field":"Economy","role":"Governor of New York; builder of the Erie Canal","did":"Critics called his project “Clinton’s Ditch.” The canal was 363 miles long and took eight years to build. When it opened in 1825, the cost of shipping goods between Buffalo and New York City fell by about 90 percent."},"progress":"The canal made New York City the nation’s biggest port and turned the Great Lakes into a busy highway for settlers and goods.","promise":"Thousands of workers, including many Irish [[immigrants|immigrant]], dug the canal by hand. Their work opened the West to millions of families.","cost":"The Ojibwe, Odawa, and Potawatomi peoples gave up most of their Michigan land in treaties, often under heavy pressure.","also":"In 1837, a financial panic hit the country and caused several years of hard times.","placeXY":[619.3,458.4]},{"id":"1845","date":"1845-12-29","when":"March–December 1845","label":"1845","fun":"Six flags have flown over Texas: those of Spain, France, Mexico, the Republic of Texas, the Confederacy and the United States.","title":"Florida and Texas join","states":["FL","TX"],"acq":"a1845","place":{"name":"San Antonio (the Alamo)","lon":-98.49,"lat":29.43},"what":"Florida became the 27th state on March 3, 1845. Texas, an independent country since 1836, became the 28th state on December 29.","why":["Texas won independence from Mexico in 1836. Most Texans wanted to join the United States.","Joining took nine years, because Texas would be a large new slave state, and because it could mean war with Mexico.","Many Americans believed in “[[Manifest Destiny]],” the idea that the U.S. was meant to spread across the continent. The phrase was first used in 1845."],"person":{"name":"Sam Houston","life":"1793–1863","field":"Politics","role":"President of the Republic of Texas","did":"Houston led the Texan army to victory over Mexico at San Jacinto in 1836 and was twice president of the Republic of Texas. He worked for years to bring Texas into the United States. In 1861, as governor, he refused to support leaving the Union, and he lost his job for it."},"progress":"Texas added about 390,000 square miles of ranch and farm land. Its ports, and later its oil, made it an economic giant.","promise":"Tejanos (Texans of Mexican descent), such as Juan Seguín, fought for Texas independence. Texas has been a meeting place of cultures ever since.","cost":"Texas and Florida both allowed slavery. In Florida, the Second Seminole War (1835–1842) was one of the longest and most costly U.S. wars against Native Americans.","also":"In 1844, Samuel Morse sent the first long-distance telegraph message, from Washington to Baltimore: “What hath God wrought.”","placeXY":[475.5,647.7]},{"id":"1846","date":"1846-12-28","when":"June–December 1846","label":"1846","fun":"Iowa is the only state whose east and west borders are formed almost completely by rivers: the Mississippi on the east, and the Missouri and Big Sioux on the west.","title":"Oregon is shared, and Iowa joins","states":["IA"],"acq":"a1846","place":{"name":"Oregon City (end of the Oregon Trail)","lon":-122.61,"lat":45.36},"what":"On June 15, 1846, the U.S. and Britain signed the Oregon Treaty. They divided the Oregon Country at the 49th parallel, which is still the border with Canada today. On December 28, Iowa became the 29th state, as farm families filled its prairie.","why":["Thousands of Americans had traveled the 2,000-mile Oregon Trail to farm in Oregon’s Willamette Valley.","President James K. Polk wanted Oregon, but he did not want a war with Britain while a war with Mexico was starting.","Iowa’s deep, rich soil drew farmers from the East and from Europe."],"person":{"name":"John Deere","life":"1804–1886","field":"Economy","role":"Blacksmith and maker of the steel plow","did":"Prairie soil was thick and sticky. It stuck to iron plows, so farmers had to stop and clean them every few steps. In 1837, Deere made a plow of polished steel that cut cleanly through the soil. By 1848 he had moved his business to Moline, Illinois, where it grew into a giant company."},"progress":"The steel plow helped turn the tall-grass prairie into some of the richest farmland in the world. Today Iowa grows more corn than any other state.","promise":"The prairie offered land to families with little money, including immigrants from Germany, Norway, Sweden, and the Netherlands.","cost":"The Meskwaki, Sauk, and Ho-Chunk peoples lost their Iowa lands through treaties. In 1857, the Meskwaki bought back land in Iowa, where their community still lives.","also":"In May 1846, the United States went to war with Mexico.","placeXY":[254.7,406.4]},{"id":"1848","date":"1848-05-29","when":"February–May 1848","label":"1848","fun":"Wisconsin is called “America’s Dairyland.” Today it makes about a quarter of all the cheese in the United States.","title":"War with Mexico, and the West changes hands","states":["WI"],"acq":"a1848","place":{"name":"Madison, Wisconsin","lon":-89.4,"lat":43.07},"what":"The Mexican–American War (1846–1848) ended with the Treaty of Guadalupe Hidalgo on February 2, 1848. Mexico gave up about half of its land, including today’s California, Nevada, and Utah, and most of Arizona. On May 29, Wisconsin became the 30th state.","why":["The two countries disagreed about Texas’s southern border: the Nueces River or the Rio Grande.","President Polk wanted California and its Pacific harbors, and Mexico refused to sell.","Wisconsin’s lead mines, forests, and farms attracted settlers, especially immigrants from Germany."],"person":{"name":"James K. Polk","life":"1795–1849","field":"Politics","role":"11th president (1845–1849)","did":"Polk promised to expand the country, and he did it in one term. He completed the joining of Texas, settled the Oregon border, and won the war with Mexico. In four years, the United States grew by more than a million square miles."},"progress":"The U.S. now reached from the Atlantic to the Pacific. Nine days before the treaty was signed, gold had been found in California.","promise":"The treaty promised that Mexicans in the new U.S. lands could become citizens and keep their property. Their descendants sometimes say: “We didn’t cross the border; the border crossed us.”","cost":"Many Americans opposed the war, including a young congressman named Abraham Lincoln. Thousands died on both sides. Later, many Mexican-American families lost their land in U.S. courts despite the treaty.","also":"In July 1848, women and men met at Seneca Falls, New York, and demanded the right to vote for women. Their declaration said “all men and women are created equal.”","placeXY":[558,457.9]},{"id":"1850","date":"1850-09-09","when":"September 9, 1850","label":"1850","fun":"Levi Strauss, a German immigrant, came to San Francisco during the Gold Rush. In 1873, he and the tailor Jacob Davis patented work pants with metal rivets: the first blue jeans.","title":"Gold! California becomes a state","states":["CA"],"place":{"name":"Sutter’s Mill","lon":-120.89,"lat":38.8},"what":"Gold was found at Sutter’s Mill in January 1848. By the end of 1849, about 100,000 newcomers had rushed to California from around the world. California skipped the usual territory stage and became the 31st state, a free state.","why":["The Gold Rush created a large population almost overnight.","Californians wrote their own constitution in 1849, and it banned slavery.","In the Compromise of 1850, Congress admitted California as a free state, but also passed a harsh law forcing the return of people who escaped slavery."],"person":{"name":"Mariano Guadalupe Vallejo","life":"1807–1890","field":"Politics","role":"Californio leader; delegate to the 1849 constitutional [[convention]]","did":"Vallejo had been a Mexican general and one of California’s richest landowners. He helped write the state’s first constitution and served in the first state Senate. That constitution required state laws to be published in both English and Spanish."},"progress":"San Francisco grew from about 1,000 people in early 1848 to about 25,000 by the end of 1849. California’s gold paid for new businesses, banks, and railroads.","promise":"People came from Mexico, Chile, China, Europe, and across the United States. California became one of the most diverse places on Earth.","cost":"California’s Native population fell from about 150,000 in 1848 to about 30,000 by 1870, because of disease, hunger, and violence, including killings paid for by the state. Chinese miners faced special taxes and attacks.","also":"In 1852, Harriet Beecher Stowe published \u003ci>Uncle Tom’s Cabin\u003c/i>. The novel turned many Northerners against slavery.","placeXY":[248.7,496.9]},{"id":"1853","date":"1853-12-30","when":"December 30, 1853","label":"1853","fun":"Tombstone, Arizona, home of the famous 1881 gunfight at the O.K. Corral, stands on land from the Gadsden Purchase.","title":"The last piece of the “lower 48”","states":[],"acq":"a1853","place":{"name":"Tucson","lon":-110.97,"lat":32.22},"what":"The U.S. agreed to buy about 30,000 square miles of land from Mexico, in today’s southern Arizona and New Mexico, for $10 million. This Gadsden Purchase was the last addition to the land of the “lower 48” states.","why":["Railroad builders wanted a flat route to the Pacific through the South, away from the Rocky Mountains.","Parts of the 1848 border were unclear, and both countries claimed the Mesilla Valley.","Mexico’s government needed money."],"person":{"name":"James Gadsden","life":"1788–1858","field":"Economy","role":"Railroad president; U.S. minister to Mexico","did":"Gadsden ran a South Carolina railroad and dreamed of a railroad from the South to the Pacific. As U.S. minister to Mexico, he negotiated the purchase. A southern railroad across this land was finished in 1883."},"progress":"Railroads later crossed this land, and Tucson grew into a major desert city.","promise":"Mexican-American communities like Tucson’s kept their language, food, music, and traditions, which still shape the Southwest.","cost":"The new border cut the homeland of the Tohono O’odham people in two. Today their nation still works to keep families and traditions connected across it.","also":"In 1854, the Kansas–Nebraska Act let settlers in those territories vote on slavery. It reopened the fight that the Missouri Compromise had settled (see 1861).","placeXY":[336.3,603.1]},{"id":"1858","date":"1858-05-11","when":"May 11, 1858","label":"1858","fun":"Minnesota calls itself “the Land of 10,000 Lakes,” but it actually has more than 11,000.","title":"Minnesota: forests, wheat, and flour","states":["MN"],"place":{"name":"St. Paul","lon":-93.09,"lat":44.95},"what":"Minnesota became the 32nd state. Its forests, lakes, and prairies drew settlers from New England and from Germany, Norway, and Sweden.","why":["In 1851, Dakota leaders signed treaties that gave up most of their land in southern Minnesota, opening it to settlers.","The Mississippi River and St. Anthony Falls gave power to sawmills and flour mills.","Minnesota entered as a free state while the nation argued bitterly about slavery."],"person":{"name":"Cyrus McCormick","life":"1809–1884","field":"Economy","role":"Inventor and maker of the mechanical reaper","did":"McCormick’s horse-drawn reaper cut wheat many times faster than a worker with a hand tool. In 1847, he built a factory in Chicago and let farmers pay for reapers over time. Machines like his made big wheat farms possible in Minnesota and on the Great Plains."},"progress":"By the 1880s, Minneapolis was the flour-milling capital of the world. Companies that started there, such as General Mills and Pillsbury, still feed the world.","promise":"Minnesota’s farms and mills gave work and land to many immigrant families, especially from Scandinavia.","cost":"Broken treaty promises and late payments led to the U.S.–Dakota War of 1862. Afterward, 38 Dakota men were hanged in the largest mass execution in U.S. history, and most Dakota people were forced out of the state.","also":"In 1857, the Supreme Court’s Dred Scott decision said Black Americans could not be citizens. Dred Scott had once lived at Fort Snelling, in what became Minnesota.","placeXY":[521.3,435.9]},{"id":"1859","date":"1859-02-14","when":"February 14, 1859","label":"1859","fun":"Oregon’s state flag is the only state flag with a different picture on each side. The back shows a beaver.","title":"Oregon: the end of the trail","states":["OR"],"place":{"name":"Oregon City","lon":-122.61,"lat":45.36},"what":"On Valentine’s Day, 1859, Oregon became the 33rd state. Tens of thousands of settlers had traveled the Oregon Trail to farm the green Willamette Valley.","why":["Oregon’s mild climate and rich soil attracted farm families from the Midwest.","After the 1846 treaty with Britain, Oregon was clearly American land, and Congress created Oregon Territory in 1848.","Settlers wanted their own government and a voice in Washington."],"person":{"name":"John McLoughlin","life":"1784–1857","field":"Economy","role":"Fur-trade leader, called the “Father of Oregon”","did":"McLoughlin ran the British Hudson’s Bay Company post at Fort Vancouver. Against his company’s wishes, he gave food, seeds, and loans to tired American settlers at the end of the trail. He later became a U.S. citizen and lived in Oregon City."},"progress":"Oregon’s farms, forests, and salmon fisheries became the base of the Pacific Northwest economy.","promise":"McLoughlin’s kindness to newcomers from another country is remembered as part of Oregon’s founding story.","cost":"Oregon’s first constitution banned Black people from moving to the state. Voters repealed the ban in 1926, but other racist words stayed in the constitution until 2002. Native nations were pushed onto reservations after wars in the 1850s.","also":"In October 1859, the abolitionist John Brown attacked the federal armory at Harpers Ferry, Virginia, hoping to start an uprising against slavery.","placeXY":[254.7,406.4]},{"id":"1861","date":"1861-01-29","when":"January 29, 1861","label":"1861","fun":"The geographic center of the 48 “lower” states is in Kansas, near the small town of Lebanon.","title":"Kansas joins as the Union breaks apart","states":["KS"],"seceded":true,"place":{"name":"Lawrence, Kansas","lon":-95.24,"lat":38.97},"what":"Kansas became the 34th state, a free state. But the Union was breaking apart. Six Southern states had already declared they were leaving. In April, Confederate forces attacked Fort Sumter, and the Civil War began. Eleven states joined the [[Confederacy]].","why":["The Kansas–Nebraska Act (1854) let settlers vote on slavery. Settlers for and against slavery rushed into Kansas, and violence followed: “Bleeding Kansas.”","After years of fighting and fraud, Kansans approved a free-state constitution in 1859.","When Southern senators left Congress, the votes to admit Kansas finally passed."],"person":{"name":"Clarina Nichols","life":"1810–1885","field":"Politics","role":"Journalist and women’s rights activist","did":"Nichols attended Kansas’s 1859 constitutional convention, knitting in the hall while she lobbied the all-male delegates. She won rights that were rare for women at the time: to own property, to have equal custody of their children, and to vote in school elections."},"progress":"Kansas became a farming powerhouse, later called the “Wheat State.”","promise":"Voting in school elections was an early step. Kansas women won the full right to vote in 1912.","cost":"The Civil War was the deadliest war in American history. About 620,000 to 750,000 soldiers died.","also":"In October 1861, the first telegraph line across the continent was finished. It ended the Pony Express after only 18 months.","placeXY":[506.1,518.4]},{"id":"1863","date":"1864-10-31","when":"1863–1864","label":"1863","fun":"Nevada sent its whole state constitution to Washington by telegraph. It was the longest telegram ever sent at the time and cost about $4,300.","title":"Two states born in war","states":["WV","NV"],"seceded":true,"place":{"name":"Wheeling","lon":-80.72,"lat":40.06},"what":"In the middle of the Civil War, two new states joined the Union. Counties in western Virginia refused to leave the Union with the rest of Virginia, and West Virginia became the 35th state on June 20, 1863. Nevada, rich in silver, became the 36th state on October 31, 1864.","why":["Many people in western Virginia were small farmers who owned no slaves and wanted to stay in the Union.","Nevada’s Comstock Lode, found in 1859, was one of the richest silver finds in history. Its silver helped pay for the Union war effort.","President Lincoln and Congress wanted more loyal states to support the war and to help end slavery."],"person":{"name":"Abraham Lincoln","life":"1809–1865","field":"Politics","role":"16th president (1861–1865)","did":"Lincoln signed the bill creating West Virginia on December 31, 1862. The next day, his [[Emancipation]] [[Proclamation]] declared enslaved people in Confederate areas free. In 1864, he welcomed Nevada, which calls itself “Battle Born.”"},"progress":"The Union also built for the future during the war. The Homestead Act (1862) offered 160 acres of land to settlers. Other 1862 laws started the transcontinental railroad and paid for new public colleges.","promise":"In the Gettysburg Address (November 19, 1863), Lincoln called for “a new birth of freedom” and a government “of the people, by the people, for the people.”","cost":"West Virginia had to agree to end slavery gradually before it could join. The war’s toll was huge. The Battle of Gettysburg alone left about 50,000 soldiers killed, wounded, captured, or missing.","also":"About 180,000 Black soldiers served in the Union Army, including the famous 54th Massachusetts Regiment.","placeXY":[647.8,483.9]},{"id":"1865","date":"1865-12-06","when":"April–December 1865","label":"1865","fun":"Juneteenth, the day freedom was announced in Texas, became a federal holiday in 2021.","title":"The Union is saved, and slavery ends","states":[],"place":{"name":"Appomattox Court House","lon":-78.8,"lat":37.38},"what":"On April 9, 1865, Confederate General Robert E. Lee surrendered at Appomattox, Virginia. Five days later, President Lincoln was shot, and he died the next morning. On June 19, now celebrated as Juneteenth, Union troops announced freedom to enslaved people in Texas. In December, the 13th Amendment ended slavery in the whole country.","why":["The Union’s larger population, factories, and railroads wore down the Confederacy.","Nearly 200,000 Black soldiers and sailors fought for the Union and for their own freedom.","[[Abolitionists|abolitionist]] had worked for decades to convince Americans that slavery must end."],"person":{"name":"Frederick Douglass","life":"c. 1818–1895","field":"Politics","role":"Abolitionist, writer, and speaker","did":"Douglass escaped from slavery in 1838 and became one of the most powerful speakers in America. During the war, he met with Lincoln, urged him to let Black men fight, and recruited soldiers, including two of his own sons. After the war, he fought for citizenship and voting rights."},"progress":"About four million people were freed. The 14th Amendment (1868) made everyone born in the U.S. a citizen. The 15th Amendment (1870) said no one could be denied the vote because of race.","promise":"During [[Reconstruction]], Black Americans voted, built schools and churches, and won public office. In 1870, Hiram Revels became the first Black U.S. senator.","cost":"After Reconstruction ended in 1877, Southern states passed “[[Jim Crow]]” laws. These laws took away Bla
