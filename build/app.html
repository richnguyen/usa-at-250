<style>
/* Layout: an atlas spread. Map plate on the left that zooms as the nation grows; the story on the right; a timeline rail along the bottom. */
:root {
  --paper: #f3f5f8;
  --sheet: #fbfcfd;
  --ink: #162133;
  --ink-2: #4a576d;
  --rule: #d4dbe4;
  --water: #d7e3ee;
  --grat: #c8d4e0;
  --land: #e9e6df;
  --land-edge: #c7c1b3;
  --union: #23427a;
  --union-ink: #ffffff;
  --union-edge: #f3f5f8;
  --new: #c4352b;
  --terr: #a7bfdc;
  --terr-new: #e7a49b;
  --sec: #6f7580;
  --gold: #876511;
  --grow: #1d7a43;
  --progress: #23427a;
  --cost: #9b3b31;
  --focus: #d89b00;
  --shadow: 0 1px 2px rgb(22 33 51 / .06), 0 8px 24px rgb(22 33 51 / .08);

  --f-display: "Libre Caslon Display", "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-serif: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1522; --sheet: #121b2a; --ink: #e7ecf3; --ink-2: #a4afc1; --rule: #283449;
    --water: #0c1827; --grat: #1a2a3e; --land: #1f2735; --land-edge: #364257;
    --union: #5d86c8; --union-ink: #0b1220; --union-edge: #0e1522; --new: #ff6b5d;
    --terr: #39587f; --terr-new: #7a3b37; --sec: #8b919c; --gold: #d9b45d; --grow: #63d18f; --progress: #93b3e8; --cost: #f1958a;
    --focus: #f5c242; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1522; --sheet: #121b2a; --ink: #e7ecf3; --ink-2: #a4afc1; --rule: #283449;
  --water: #0c1827; --grat: #1a2a3e; --land: #1f2735; --land-edge: #364257;
  --union: #5d86c8; --union-ink: #0b1220; --union-edge: #0e1522; --new: #ff6b5d;
  --terr: #39587f; --terr-new: #7a3b37; --sec: #8b919c; --gold: #d9b45d; --grow: #63d18f; --progress: #93b3e8; --cost: #f1958a;
  --focus: #f5c242; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font: 16px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
a { color: inherit; }

.app { height: 100%; position: relative; overflow: hidden; }
/* frosted glass for the bar that floats over the top of the map */
.timeline {
  background: linear-gradient(180deg, color-mix(in srgb, var(--sheet) 34%, transparent), color-mix(in srgb, var(--sheet) 24%, transparent));
  -webkit-backdrop-filter: blur(7px) saturate(1.8); backdrop-filter: blur(7px) saturate(1.8);
  text-shadow: 0 0 10px var(--sheet), 0 0 2px var(--sheet);
}
.timeline .round { background: color-mix(in srgb, var(--sheet) 70%, transparent); }

/* ---------- head row: the brand on the left, the milestone heading centered ---------- */
.headrow {
  display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(0, max-content) minmax(0, 1fr);
  align-items: center; gap: 16px; margin-bottom: 8px;
}
.brand { display: flex; align-items: center; gap: 10px; justify-self: start; }
.brand h1 { margin: 0; font: 400 21px/1 var(--f-display); letter-spacing: .01em; white-space: nowrap; color: var(--ink); }
.flag-wrap { position: relative; flex: none; }
.flag {
  width: 46px; aspect-ratio: 19 / 10; border-radius: 2px; overflow: hidden; cursor: help;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 22%, transparent), 0 2px 6px rgb(0 0 0 / .12);
}
.flag svg { display: block; width: 100%; height: 100%; }
.flag.changed { animation: flagin .9s ease-out 1; }
@keyframes flagin { 0% { transform: scale(.82); opacity: .2; } 100% { transform: none; opacity: 1; } }
.flag-cap {
  position: absolute; left: -4px; top: calc(100% + 10px); transform: translateY(-4px); z-index: 30;
  margin: 0; width: max-content; max-width: 280px; padding: 8px 12px; border-radius: 8px;
  background: var(--ink); color: var(--paper); font-size: 13.5px; line-height: 1.4; text-shadow: none; text-align: left;
  box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
}
.flag-cap::before { content: ""; position: absolute; left: 27px; top: -5px; width: 10px; height: 10px; margin-left: -5px; background: var(--ink); transform: rotate(45deg); }
.flag-cap b { font-weight: 700; }
.flag-wrap:hover .flag-cap, .flag-wrap:focus-within .flag-cap { opacity: 1; transform: none; }

/* growth since the previous milestone, as a green + badge */
.delta {
  display: inline-block; margin-left: 5px; padding: 0 6px 1px; border-radius: 999px; vertical-align: 1px;
  background: color-mix(in srgb, var(--grow) 15%, transparent); color: var(--grow);
  border: 1px solid color-mix(in srgb, var(--grow) 35%, transparent);
  font: 700 11.5px/1.4 var(--f-body); font-variant-numeric: tabular-nums; text-shadow: none;
  animation: deltain .5s ease-out both;
}
@keyframes deltain { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- bottom right of the map: key and tools ---------- */
.map-foot {
  position: absolute; z-index: 6; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - min(490px, 37vw) - 42px);
  display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px;
}
.map-foot .legend { flex: 0 1 auto; min-width: 0; }
.tools { display: flex; flex-direction: column; align-items: stretch; gap: 6px; flex: none; }
.tools .btn-quiet { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn-quiet {
  border: 1px solid var(--rule); border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; color: var(--ink);
  background: color-mix(in srgb, var(--sheet) 82%, transparent); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
  box-shadow: 0 1px 2px rgb(22 33 51 / .06), 0 4px 14px rgb(22 33 51 / .08);
}
.btn-quiet:hover { border-color: var(--ink-2); }
.theme-btn { display: inline-flex; align-items: center; gap: 6px; padding-left: 11px; }
.theme-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- stage ---------- */
.stage { position: absolute; inset: 0; }
.mapwrap { position: relative; height: 100%; background: var(--water); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }

/* map layers */
#map .water { fill: var(--water); }
#map .grat { fill: none; stroke: var(--grat); stroke-width: .6px; vector-effect: non-scaling-stroke; }
#map .land { fill: var(--land); stroke: var(--land-edge); stroke-width: .6px; vector-effect: non-scaling-stroke; }
#map .usland { fill: var(--land); }
#map .acq { fill: var(--terr); opacity: 0; transition: opacity .6s ease, fill .6s ease; }
#map .acq.on { opacity: 1; }
#map .acq.fresh { opacity: 1; fill: var(--terr-new); }
#map .acq-edge { fill: none; stroke: var(--new); stroke-width: 1.6px; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; opacity: 0; transition: opacity .6s; }
#map .acq-edge.fresh { opacity: 1; }
#map .st { fill: transparent; stroke: var(--land-edge); stroke-width: .7px; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; transition: fill .6s ease; cursor: pointer; }
#map .st.in { fill: var(--union); stroke: var(--union-edge); stroke-dasharray: none; stroke-width: .9px; }
#map .st.sec { fill: var(--sec); stroke: var(--union-edge); stroke-dasharray: none; stroke-width: .9px; }
#map .st.new { fill: var(--new); stroke: var(--union-edge); stroke-dasharray: none; stroke-width: 1.1px; }
#map .st:hover { filter: brightness(1.12); }
#map .st.new { animation: pulse 1.4s ease-out 1; }
@keyframes pulse { 0% { fill-opacity: .2; } 60% { fill-opacity: 1; } }
#map .inset-bg { fill: var(--water); }
#map [data-inset] { transition: opacity .6s ease; }
#map [data-inset].inset-off { opacity: 0; pointer-events: none; }
#map .inset { fill: none; stroke: var(--ink-2); stroke-width: .8px; vector-effect: non-scaling-stroke; stroke-dasharray: 3 3; }
#map text { font-family: var(--f-body); pointer-events: none; paint-order: stroke; }
#map .lbl { font-size: calc(var(--k, 1) * 11px); font-weight: 700; fill: var(--union-ink); text-anchor: middle; dominant-baseline: central; letter-spacing: .04em; opacity: 0; transition: opacity .4s; }
#map .lbl.show { opacity: .92; }
#map .lbl.call { fill: var(--ink); }
#map .lbl.newname { fill: var(--ink); stroke: var(--sheet); stroke-width: calc(var(--k, 1) * 3.5px); font-size: calc(var(--k, 1) * 13px); }
#map .leader { stroke: var(--ink-2); stroke-width: .7px; vector-effect: non-scaling-stroke; opacity: 0; transition: opacity .4s; }
#map .leader.show { opacity: .7; }
#map .geo-lbl { font-size: calc(var(--k, 1) * 11px); letter-spacing: .3em; fill: var(--ink-2); opacity: .75; text-anchor: middle; }
#map .geo-lbl.sea { font-style: italic; letter-spacing: .18em; }
#map .acq-lbl { font-family: var(--f-serif); font-style: italic; font-size: calc(var(--k, 1) * 14px); fill: var(--ink); stroke: var(--sheet); stroke-width: calc(var(--k, 1) * 4px); opacity: 0; transition: opacity .5s; }
#map #inset { transition: opacity .5s; }
#map .acq-lbl.show { opacity: 1; }
#map .inset-lbl { font-size: calc(var(--k, 1) * 10px); fill: var(--ink-2); letter-spacing: .08em; }
#pin circle.dot { fill: var(--ink); stroke: var(--sheet); stroke-width: 2px; vector-effect: non-scaling-stroke; }
#pin circle.ring { fill: none; stroke: var(--ink); stroke-width: 1.2px; vector-effect: non-scaling-stroke; opacity: .5; }
#pin text { font-size: 12.5px; font-weight: 700; fill: var(--ink); stroke: var(--sheet); stroke-width: 3.5px; stroke-linejoin: round; }

.mapcanvas { position: absolute; inset: 0; }

/* ---------- state bubbles on the map ---------- */
.callouts { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.co-lines { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; overflow: visible; }
.co-lines path { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; opacity: .6; }
.co-lines .halo { fill: color-mix(in srgb, var(--sheet) 55%, transparent); stroke: none; }
.co-lines .dot { fill: var(--ink); stroke: var(--sheet); stroke-width: 2; }
#pin.quiet { visibility: hidden; }
.co {
  position: absolute; left: 0; top: 0; pointer-events: auto; box-sizing: border-box;
  background: color-mix(in srgb, var(--sheet) 90%, transparent);
  -webkit-backdrop-filter: blur(8px) saturate(1.4); backdrop-filter: blur(8px) saturate(1.4);
  border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); border-radius: 12px;
  box-shadow: 0 1px 2px rgb(22 33 51 / .08), 0 10px 26px rgb(22 33 51 / .16);
  animation: coin .35s ease-out both;
}
.co.noanim { animation: none; }
@keyframes coin { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
.co.full { width: 276px; padding: 12px 14px 13px; }
.co.compact { display: flex; align-items: center; gap: 10px; box-sizing: border-box; width: 292px; padding: 6px 30px 7px 9px; }
.co-head { display: flex; align-items: center; gap: 11px; padding-right: 20px; }
.co-flag { flex: none; width: 54px; height: 36px; object-fit: contain; filter: drop-shadow(0 1px 1px rgb(0 0 0 / .25)) drop-shadow(0 0 .6px rgb(0 0 0 / .5)); }
.co.compact .co-flag { width: 40px; height: 27px; }
.co-name { margin: 0; font: 400 22px/1.1 var(--f-display); color: var(--ink); }
.co.compact .co-name { font-size: 17.5px; white-space: nowrap; }
.co-ord { margin: 5px 0 0; font: 700 10.5px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--new); }
.co.compact .co-ord { display: inline; margin: 0 0 0 7px; vertical-align: 2px; }
.co-facts { margin: 11px 0 0; padding-top: 10px; border-top: 1px solid var(--rule); display: grid; gap: 7px; }
.co-facts div { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.co-facts dt { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.co-facts dd { margin: 0; font-size: 14.5px; line-height: 1.35; color: var(--ink); font-variant-numeric: tabular-nums; }
.co-facts dd span { font-size: 12.5px; color: var(--ink-2); }
.co-facts dd small { display: block; font-size: 12.5px; color: var(--ink-2); }
.co-line { margin: 1px 0 0; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.co-line b { font-weight: 600; color: var(--ink); }
.co.note .co-text { margin: 10px 0 0; padding-top: 9px; border-top: 1px solid var(--rule); font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.co-x {
  position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%;
  display: grid; place-items: center; background: transparent; color: var(--ink-2); cursor: pointer;
}
.co.compact .co-x { top: 50%; margin-top: -11px; }
.co-x:hover { background: var(--rule); color: var(--ink); }
.co-x svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.mapwrap.co-on #map .lbl.isnew, .mapwrap.co-on #map .leader.isnew { visibility: hidden; }

.legend {
  box-sizing: border-box; max-width: 100%; width: max-content;
  background: color-mix(in srgb, var(--sheet) 55%, transparent); -webkit-backdrop-filter: blur(7px) saturate(1.6); backdrop-filter: blur(7px) saturate(1.6);
  border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; font-size: 12.5px;
}
.legend .row { display: flex; gap: 7px; align-items: center; white-space: nowrap; }
.legend .sw { width: 13px; height: 13px; border-radius: 3px; flex: none; border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
.legend .sw.in { background: var(--union); }
.legend .sw.new { background: var(--new); }
.legend .sw.terr { background: var(--terr); }
.legend .sw.sec { background: var(--sec); }
.legend .sw.out { background: var(--land); }
.legend .note { color: var(--ink-2); font-size: 11.5px; }

#tip {
  position: absolute; z-index: 5; pointer-events: none;
  background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px;
  padding: 8px 10px; font-size: 13.5px; line-height: 1.35; box-shadow: var(--shadow); max-width: 240px;
}
#tip b { font-family: var(--f-serif); font-size: 15px; }

/* ---------- the story: one reading page over the map, each section can be shown or hidden ---------- */
.story {
  position: absolute; z-index: 4; left: max(14px, env(safe-area-inset-left, 0px));
  top: calc(var(--top-h, 130px) + 12px); bottom: calc(var(--bot-h, 80px) + 12px);
  box-sizing: border-box; width: min(490px, 37vw); overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth;
  background: color-mix(in srgb, var(--sheet) 94%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid var(--rule); border-radius: 16px;
  box-shadow: 0 1px 2px rgb(22 33 51 / .06), 0 14px 40px rgb(22 33 51 / .16);
  padding: 18px 24px 28px;
}
.story[hidden] { display: none; }
.story-top { display: flex; align-items: center; gap: 10px; }
.story-kicker { margin: 0; flex: 1; display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.story-kicker .era { color: var(--new); font-weight: 700; }
.pill-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--paper); font-size: 12.5px; font-weight: 600; color: var(--ink-2);
}
.pill-btn:hover { color: var(--ink); border-color: var(--ink-2); }
.pill-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.story-title { margin: 10px 0 2px; font: 400 29px/1.13 var(--f-display); text-wrap: balance; }
.story-when { margin: 0; font: italic 400 16px var(--f-serif); color: var(--ink-2); }
.story-tools { display: flex; gap: 8px; margin: 14px 0 6px; }
.story-tools .pill-btn { font-weight: 500; }
.story-show {
  position: absolute; z-index: 4; left: max(14px, env(safe-area-inset-left, 0px)); top: calc(var(--top-h, 130px) + 12px);
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--rule); background: color-mix(in srgb, var(--sheet) 92%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  font-size: 14px; font-weight: 600; color: var(--ink); box-shadow: 0 6px 20px rgb(22 33 51 / .14);
}
.story-show svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.ss { border-top: 1px solid var(--rule); }
.ss-h { margin: 0; }
.ss-h button {
  display: flex; align-items: center; gap: 11px; width: 100%; padding: 13px 2px; cursor: pointer; text-align: left;
  background: none; border: 0; color: var(--ink); font: 400 20px/1.2 var(--f-display);
}
.ss-h button:hover .chev { color: var(--ink); }
.ss-h .ico { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.ss-h .chev { width: 18px; height: 18px; margin-left: auto; flex: none; fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
.ss-h button[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.ss-h .count { min-width: 21px; height: 21px; padding: 0 6px; border-radius: 999px; background: var(--new); color: #fff; font: 700 11.5px/21px var(--f-body); text-align: center; }
.ss-b { padding: 0 0 18px; }
.ss-b[hidden] { display: none; }
.ss[data-sec="progress"] .ss-h button { color: var(--progress); }
.ss[data-sec="promise"] .ss-h button, .ss[data-sec="fun"] .ss-h button { color: var(--gold); }
.ss[data-sec="cost"] .ss-h button { color: var(--cost); }
.ss-b p { margin: 0; }
.ss-b .body { font-size: 16.5px; line-height: 1.62; }
.ss[data-sec="picture"] { border-top: 0; }
.ss[data-sec="picture"] .ss-b { padding-bottom: 14px; }
.fun-box {
  padding: 13px 16px 14px; border-radius: 10px;
  background: color-mix(in srgb, var(--gold) 11%, var(--sheet)); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
}

figure.ill { margin: 0; }
figure.ill .frame { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; display: grid; place-items: center; }
figure.ill img { display: block; width: 100%; height: auto; max-height: 300px; object-fit: contain; }
.fun-text { font-size: 17px; line-height: 1.55; }
figcaption, .credit { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; line-height: 1.45; }
figcaption i, .credit i { font-family: var(--f-serif); }
figcaption a, .credit a { text-underline-offset: 2px; }

ul.why { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 16px; line-height: 1.55; }
ul.why li { padding-left: 22px; position: relative; }
ul.why li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; border: 1.5px solid var(--ink-2); transform: rotate(45deg); }

.person .head { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; align-items: center; }
.person .portrait { width: 92px; height: 112px; border-radius: 6px; overflow: hidden; background: var(--rule); display: grid; place-items: center; font: 400 30px var(--f-display); color: var(--ink-2); }
.person .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
.person .name { font: 400 25px/1.1 var(--f-display); margin: 0; }
.person .life { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }

<script>
const DATA = %%DATA%%;

<script>
(() => {
const { stops, states, acq, pop, eras, glossary, geo, images, original13, confederacy } = DATA;
const $ = (s, el = document) => el.querySelector(s);
const svg = $('#map');
const N = stops.length;
const ORD = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
const MONTHS = ['Jan.','Feb.','March','April','May','June','July','Aug.','Sept.','Oct.','Nov.','Dec.'];
const fmtDate = iso => { const [y, m, d] = iso.split('-').map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// state order numbers (official order of statehood)
const order = Object.entries(states).sort((a, b) => a[1][1].localeCompare(b[1][1]) || a[0].localeCompare(b[0]));
const ordinal = {}; order.forEach(([p], i) => ordinal[p] = i + 1);
ordinal.ND = 39; ordinal.SD = 40;

const inUnion = (p, date) => (original13.includes(p) && date >= '1776-07-04') || states[p][1] <= date;

// ---------- glossary markup ----------
function gloss(text) {
  return text.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, shown, key) => {
    const k = (key || shown).toLowerCase();
    if (!glossary[k]) return shown;
    return `<button type="button" class="term" data-k="${esc(k)}" aria-expanded="false">${shown}</button>`;
  });
}

// ---------- flag ----------
// The official flag in force on a date. Stars and Stripes from June 14, 1777; 15 stars and stripes from
// May 1, 1795; from July 4, 1818, 13 stripes and one star per state, added on the July 4 after a state joins.
const FLAGS = (() => {
  const list = [
    { from: '1775-12-03', union: true },
    { from: '1777-06-14', stars: 13, stripes: 13 },
    { from: '1795-05-01', stars: 15, stripes: 15 }
  ];
  let prev = 0;
  for (let y = 1818; y <= 1960; y++) {
    const d = `${y}-07-04`;
    const n = Object.values(states).filter(v => v[1] < d).length;
    if (n !== prev) { list.push({ from: d, stars: n, stripes: 13 }); prev = n; }
  }
  list.forEach((e, i) => { e.to = list[i + 1] ? list[i + 1].from : null; });
  return list;
})();
const flagAt = date => FLAGS.filter(f => f.from <= date).pop();

function starPath(x, y, r) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .382 : r;
    d += (i ? 'L' : 'M') + (x + rr * Math.cos(a)).toFixed(2) + ' ' + (y + rr * Math.sin(a)).toFixed(2);
  }
  return d + 'Z';
}
// Star positions in the blue canton. The 1912, 1959 and 1960 layouts are the official ones;
// earlier laws set no pattern, so those flags use a typical layout.
function starLayout(n, cw, ch) {
  const pts = [];
  let r;
  if (n === 13) {
    for (let i = 0; i < 13; i++) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / 13;
      pts.push([cw / 2 + ch * .34 * Math.cos(a), ch / 2 + ch * .34 * Math.sin(a)]);
    }
    r = ch * .085;
  } else if (n === 50) {
    for (let row = 0; row < 9; row++) for (let c = 0; c < (row % 2 ? 5 : 6); c++) pts.push([cw / 12 * (1 + 2 * c + row % 2), ch / 10 * (row + 1)]);
    r = 3.08;
  } else if (n === 49) {
    for (let row = 0; row < 7; row++) for (let c = 0; c < 7; c++) pts.push([cw / 15 * (1 + 2 * c + row % 2), ch / 8 * (row + 1)]);
    r = 3.2;
  } else if (n === 48) {
    for (let row = 0; row < 6; row++) for (let c = 0; c < 8; c++) pts.push([cw / 8 * (c + .5), ch / 6 * (row + .5)]);
    r = 3.1;
  } else {
    const rows = Math.min(7, Math.max(3, Math.round(Math.sqrt(n / 1.41))));
    const base = Math.floor(n / rows), extra = n % rows, cols = Math.ceil(n / rows);
    const sx = cw / cols, sy = ch / rows;
    for (let row = 0; row < rows; row++) {
      const long = Math.floor((row + 1) * extra / rows) > Math.floor(row * extra / rows);
      const k = base + (long ? 1 : 0);
      for (let c = 0; c < k; c++) pts.push([sx * (c + .5 + (cols - k) / 2), sy * (row + .5)]);
    }
    r = Math.min(sx, sy) * .36;
  }
  return pts.map(([x, y]) => starPath(x, y, r)).join('');
}
function flagSVG(f) {
  const W = 190, H = 100, red = '#b22234', white = '#ffffff', blue = '#3c3b6e';
  const n = f.union ? 13 : f.stripes, sh = H / n;
  const ch = sh * (n === 15 ? 8 : 7), cw = 76;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect width="${W}" height="${H}" fill="${white}"/>`;
  for (let i = 0; i < n; i += 2) s += `<rect y="${(i * sh).toFixed(3)}" width="${W}" height="${sh.toFixed(3)}" fill="${red}"/>`;
  if (f.union) {
    // British Union Flag of 1606 in the canton: St Andrew's white saltire under St George's red cross
    const t = ch / 5;
    s += `<svg width="${cw}" height="${ch.toFixed(3)}" viewBox="0 0 ${cw} ${ch.toFixed(3)}"><rect width="${cw}" height="${ch}" fill="${blue}"/>`
      + `<path d="M0 0L${cw} ${ch}M${cw} 0L0 ${ch}" stroke="${white}" stroke-width="${t}"/>`
      + `<rect x="0" y="${ch / 2 - t * .85}" width="${cw}" height="${t * 1.7}" fill="${white}"/><rect x="${cw / 2 - t * .85}" y="0" width="${t * 1.7}" height="${ch}" fill="${white}"/>`
      + `<rect x="0" y="${ch / 2 - t / 2}" width="${cw}" height="${t}" fill="${red}"/><rect x="${cw / 2 - t / 2}" y="0" width="${t}" height="${ch}" fill="${red}"/></svg>`;
  } else {
    s += `<rect width="${cw}" height="${ch.toFixed(3)}" fill="${blue}"/><path fill="${white}" d="${starLayout(f.stars, cw, ch)}"/>`;
  }
  return s + '</svg>';
}
let lastFlag = null;
function showFlag(s) {
  const f = flagAt(s.date), el = $('#flag');
  const y0 = f.from.slice(0, 4), y1 = f.to ? f.to.slice(0, 4) : null;
  const what = f.union ? 'Continental Colors' : `${f.stars} stars, ${f.stripes} stripes`;
  const when = f.union ? 'used 1775–1777, before the Stars and Stripes' : (y1 ? `official flag ${y0}–${y1}` : `official flag since July 4, ${y0}`);
  $('#flag-cap').innerHTML = `<b>${what}</b> · ${when}`;
  el.setAttribute('aria-label', `U.S. flag in ${s.label}: ${what}, ${when}`);
  if (f !== lastFlag) {
    el.innerHTML = flagSVG(f);
    if (lastFlag) { el.classList.remove('changed'); void el.offsetWidth; el.classList.add('changed'); }
    lastFlag = f;
  }
}

// ---------- stats ----------

      d = `M${a.ax.toFixed(1)} ${a.ay.toFixed(1)}L${kx.toFixed(1)} ${ey.toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}`;
    } else {
      const ex = clampTo(a.ax, a.x + 12, a.x + a.w - 12), ey = clampTo(a.ay, a.y + 10, a.y + a.h - 10);
      const px = a.ax < a.x ? a.x : a.ax > a.x + a.w ? a.x + a.w : ex, py = a.ay < a.y ? a.y : a.ay > a.y + a.h ? a.y + a.h : ey;
      d = `M${a.ax.toFixed(1)} ${a.ay.toFixed(1)}L${px.toFixed(1)} ${py.toFixed(1)}`;
    }
    return `<path d="${d}"/><circle class="halo" cx="${a.ax.toFixed(1)}" cy="${a.ay.toFixed(1)}" r="9"/><circle class="dot" cx="${a.ax.toFixed(1)}" cy="${a.ay.toFixed(1)}" r="4.5"/>`;
  }).join('');
}
coLayer.addEventListener('click', e => {
  const b = e.target.closest('[data-hide]'); if (!b) return;
  coHidden.add(b.dataset.hide); layoutCallouts(true);
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layoutCallouts(true));

function renderMilestone(s) {
  $('#cap-t').textContent = s.title;
}
// Land added at this milestone, for the reading page
function landBody(s) {
  return `<div class="ycs land"><span class="sw"></span><p><b>${esc(acq[s.acq].name)}</b> <span>· about ${acq[s.acq].approx} sq mi of land added</span></p></div>`;
}

// ---------- story sections ----------
// Each section of the story is a button in the dock. A button opens its panel; pressing it again (or ×) closes it.
// Open panels stay open while you move between milestones, and show the new milestone's text.
const ICONS = {
  land: '<path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/>',
  picture: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/>',
  fun: '<path d="M12 3.2l2.6 5.5 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7z"/>',
  what: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
  why: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6M12 17h.01"/>',
  people: '<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',
  progress: '<path d="M4 18l6-6 4 4 6-7"/><path d="M15 9h5v5"/>',
  promise: '<path d="M5 21V4"/><path d="M5 4.5h11l-2 4 2 4H5"/>',
  cost: '<path d="M12 4v16M5 20h14M6 8h12M6 8l-3 6a3 3 0 0 0 6 0zM18 8l-3 6a3 3 0 0 0 6 0z"/>',
  also: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const svgIcon = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;
// The story page lists every section in reading order; each can be shown or hidden, and the choice is kept
// across milestones (and remembered in the browser).
const SECTIONS = [
  { id: 'picture', title: () => 'Picture', has: s => !!(images[s.id] || {}).ill },
  { id: 'fun', title: () => 'Fun fact', has: s => !!s.fun },
  { id: 'land', title: () => 'New land', has: s => !!s.acq },
  { id: 'what', title: () => 'What happened', has: () => true },
  { id: 'why', title: s => s.whyTitle || 'Why it happened', has: () => true },
  { id: 'people', title: () => 'The people', has: () => true },
  { id: 'progress', title: () => 'The progress', has: () => true },
  { id: 'promise', title: () => 'The promise', has: () => true },
  { id: 'cost', title: s => s.costTitle || 'The cost', has: () => true },
  { id: 'also', title: () => 'Also in this era', has: s => !!s.also }
];
let closed = new Set();
try { JSON.parse(localStorage.getItem('closedSections') || '[]').forEach(k => closed.add(k)); } catch (e) {}
const saveClosed = () => { try { localStorage.setItem('closedSections', JSON.stringify([...closed])); } catch (e) {} };
const CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

function sectionBody(id, s) {
  const im = images[s.id] || {};
  if (id === 'land') return landBody(s);
  if (id === 'picture') return `<figure class="ill"><div class="frame"><img src="${esc(im.ill.file)}" alt="${esc(im.ill.alt || im.ill.title)}" width="${im.ill.w}" height="${im.ill.h}"></div><figcaption>${credit(im.ill, 'Illustration')}</figcaption></figure>`;
  if (id === 'fun') return `<div class="fun-box"><p class="body">${gloss(s.fun)}</p></div>`;
  if (id === 'what') return `<p class="body">${gloss(s.what)}</p>`;
  if (id === 'why') return `<ul class="why">${s.why.map(w => `<li>${gloss(w)}</li>`).join('')}</ul>`;
  if (id === 'people') {
    const p = s.person;
    const initials = p.name.split(/\s+/).filter(w => /^[A-Z]/.test(w)).map(w => w[0]).slice(0, 2).join('');
    const contain = im.person && im.person.w / im.person.h > 1.6;
    const portrait = im.person ? `<img src="${esc(im.person.file)}" alt="${esc(im.person.title)}"${contain ? ' style="object-fit:contain;background:var(--sheet)"' : ''}>` : initials;
    return `<div class="person"><div class="head"><div class="portrait">${portrait}</div><div>
      <p class="name">${esc(p.name)}</p><p class="life">${esc(p.life)} · ${gloss(p.role)}</p>
      <span class="field ${esc(p.field)}">${esc(p.field)}</span></div></div>
      <p class="did">${gloss(p.did)}</p>
      ${im.person ? `<p class="credit">${credit(im.person, 'Image')}</p>` : ''}</div>`;
  }
  if (id === 'progress') return `<p class="body">${gloss(s.progress)}</p>`;
  if (id === 'promise') return `<p class="body">${gloss(s.promise)}</p>`;
  if (id === 'cost') return `<p class="body">${gloss(s.cost)}</p>`;
  if (id === 'also') return `<p class="body">${gloss(s.also)}</p>`;
  return '';
}
function renderPanels() {
  const s = stops[cur];
  const era = eras.find(e => s.date.slice(0, 4) >= e.from && s.date.slice(0, 4) <= e.to) || eras[eras.length - 1];
  $('#story-kicker').innerHTML = `<span class="era">${esc(era.name)}</span><span>Milestone ${cur + 1} of ${N}</span>`;
  $('#story-title').textContent = s.title;
  $('#story-when').textContent = s.when;
  $('#story-body').innerHTML = SECTIONS.filter(sec => sec.has(s)).map(sec => {
    const shut = closed.has(sec.id), n = sec.count ? sec.count(s) : 0;
    return `<section class="ss" data-sec="${sec.id}">
      <h3 class="ss-h"><button type="button" data-sec="${sec.id}" aria-expanded="${!shut}" aria-controls="ss-${sec.id}">${svgIcon(sec.id).replace('<svg', '<svg class="ico"')}<span>${esc(sec.title(s))}</span>${n ? `<b class="count" aria-label="${n} states">${n}</b>` : ''}${CHEV}</button></h3>
      <div class="ss-b" id="ss-${sec.id}"${shut ? ' hidden' : ''}>${sectionBody(sec.id, s)}</div>
    </section>`;
  }).join('');
  $('#story').scrollTop = 0;
}
function setSection(id, show) {
  if (show) closed.delete(id); else closed.add(id);
  const btn = $(`.ss-h button[data-sec="${id}"]`), body = $('#ss-' + id);
  if (btn) btn.setAttribute('aria-expanded', String(show));
  if (body) body.hidden = !show;
}
$('#story-body').addEventListener('click', e => {
  const b = e.target.closest('.ss-h button'); if (!b) return;
  setSection(b.dataset.sec, b.getAttribute('aria-expanded') !== 'true'); saveClosed();
});
$('#ss-all-open').addEventListener('click', () => { SECTIONS.forEach(sec => setSection(sec.id, true)); saveClosed(); });
$('#ss-all-close').addEventListener('click', () => { SECTIONS.forEach(sec => setSection(sec.id, false)); saveClosed(); });
// hide or show the whole story page; the map recenters in the space it leaves
let storyHidden = false;
try { storyHidden = localStorage.getItem('storyHidden') === '1'; } catch (e) {}
function setStory(hidden) {
  storyHidden = hidden;
  $('#story').hidden = hidden; $('#story-show').hidden = !hidden;
  try { localStorage.setItem('storyHidden', hidden ? '1' : '0'); } catch (e) {}
  if (cur >= 0) zoomTo(stops[cur]);
}
$('#story-hide').addEventListener('click', () => setStory(true));
$('#story-show').addEventListener('click', () => setStory(false));

// glossary popover
const popEl = $('#pop');
let popFor = null;
function showPop(btn) {
  const k = btn.dataset.k;
  popEl.innerHTML = `<b>${esc(k)}</b>${esc(glossary[k])}`;
  popEl.hidden = false;
  const r = btn.getBoundingClientRect();
  const pw = Math.min(280, innerWidth - 24);
  let x = Math.min(Math.max(12, r.left), innerWidth - pw - 12);
  let y = r.bottom + 8;
  popEl.style.left = x + 'px'; popEl.style.top = y + 'px';
  const ph = popEl.offsetHeight;
  if (y + ph > innerHeight - 12) popEl.style.top = (r.top - ph - 8) + 'px';
  if (popFor) popFor.setAttribute('aria-expanded', 'false');
  popFor = btn; btn.setAttribute('aria-expanded', 'true');
}
function hidePop() { popEl.hidden = true; if (popFor) popFor.setAttribute('aria-expanded', 'false'); popFor = null; }
document.addEventListener('click', e => {
  const t = e.target.closest('.term');
  if (t) { popFor === t ? hidePop() : showPop(t); e.stopPropagation(); return; }
  if (!e.target.closest('#pop')) hidePop();
});
document.addEventListener('mouseover', e => { const t = e.target.closest('.term'); if (t && matchMedia('(hover: hover)').matches) showPop(t); });
document.addEventListener('mouseout', e => { const t = e.target.closest('.term'); if (t && matchMedia('(hover: hover)').matches && !t.contains(e.relatedTarget)) hidePop(); });
$('#story').addEventListener('scroll', hidePop, { passive: true });

// ---------- timeline ----------
const slider = $('#slider');
slider.max = N - 1;
const pos = i => `calc(var(--thumb) / 2 + (100% - var(--thumb)) * ${i / (N - 1)})`;
$('#ticks').innerHTML = stops.map((s, i) => `<span class="tick ${s.states.length || s.acq ? 'state' : ''}" style="left:${pos(i)}" title="${esc(s.label)}: ${esc(s.title)}"></span>`).join('');
const eraIdx = eras.map(e => {
  const idx = stops.map((s, i) => [s, i]).filter(([s]) => s.date.slice(0, 4) >= e.from && s.date.slice(0, 4) <= e.to).map(([, i]) => i);
  return { e, a: idx[0], b: idx[idx.length - 1] };
}).filter(x => x.a !== undefined);
// each era's label sits at its first milestone: the year, then the era's name (cut short if the next era is close)
$('#eras').innerHTML = eraIdx.map(({ e, a }, k) => {
  const next = eraIdx[k + 1];
  const right = next ? `calc(100% - (${pos(next.a)}) + 21px)` : `calc(100% - (${pos(N - 1)}) + 26px)`;
  return `<span class="era-band" data-era="${e.id}" style="left:calc(${pos(a)} - 15px);right:${right}" title="${esc(stops[a].label)}: ${esc(e.name)}"><b class="ey">${esc(stops[a].label)}</b>${esc(e.name)}</span>`;
}).join('') + `<span class="era-start">${esc(stops[0].label)}</span><span class="era-end" style="left:${pos(N - 1)}">${esc(stops[N - 1].label)}</span>`;
slider.addEventListener('input', () => go(+slider.value, true));

// ---------- navigation ----------
let cur = -1;
function go(i, fromSlider) {
  i = Math.max(0, Math.min(N - 1, i));
  if (i === cur) return;
  cur = i;
  coHidden.clear();
  const s = stops[i];
  hidePop();
  $('#yr').textContent = s.label;
  if (!fromSlider) slider.value = i;
  slider.setAttribute('aria-valuetext', `${s.label}: ${s.title}`);
  $('#rail-fill').style.width = `${(i / (N - 1)) * 100}%`;
  document.querySelectorAll('.tick').forEach((t, j) => t.classList.toggle('past', j <= i));
  const era = eras.find(e => s.date.slice(0, 4) >= e.from && s.date.slice(0, 4) <= e.to);
  document.querySelectorAll('.era-band').forEach(b => b.classList.toggle('cur', era && b.dataset.era === era.id));
  $('#btn-prev').disabled = i === 0; $('#btn-next').disabled = i === N - 1;
  stats(s); showFlag(s); mapState(s); renderMilestone(s); renderPanels(); zoomTo(s);
  try { history.replaceState(null, '', '#' + s.id); } catch (e) {}
}
$('#btn-prev').addEventListener('click', () => { stopPlay(); go(cur - 1); });
$('#btn-next').addEventListener('click', () => { stopPlay(); go(cur + 1); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hidePop(); closeSheets(); return; }
  if (e.target.closest('input, textarea, select, .sheet-overlay:not([hidden])')) return;
  if (e.key === 'ArrowRight') { stopPlay(); go(cur + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { stopPlay(); go(cur - 1); e.preventDefault(); }
});

let timer = 0;
function stopPlay() { clearInterval(timer); timer = 0; $('#btn-play').setAttribute('aria-label', 'Play the story'); $('#play-ico').innerHTML = '<path d="M8 5v14l11-7z"/>'; }
$('#btn-play').addEventListener('click', () => {
  if (timer) return stopPlay();
  if (cur === N - 1) go(0);
  $('#btn-play').setAttribute('aria-label', 'Pause');
  $('#play-ico').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  timer = setInterval(() => { if (cur >= N - 1) return stopPlay(); go(cur + 1); }, 6500);
});

new ResizeObserver(() => { if (cur >= 0) zoomTo(stops[cur], true); }).observe(svg);
const barsRO = new ResizeObserver(() => { syncBars(); if (cur >= 0) zoomTo(stops[cur], true); });
barsRO.observe($('.timeline')); barsRO.observe($('#map-foot'));

// ---------- overlays ----------
function openSheet(id) { const o = $(id); o.hidden = false; o.querySelector('[data-close]').focus(); }
function closeSheets() { document.querySelectorAll('.sheet-overlay').forEach(o => o.hidden = true); }
document.querySelectorAll('.sheet-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-close]')) closeSheets(); }));
$('#btn-words').addEventListener('click', () => openSheet('#ov-words'));
$('#btn-about').addEventListener('click', () => openSheet('#ov-about'));

// ---------- light / dark mode ----------
const themeBtn = $('#btn-theme');
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const ICON_SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>';
const isDark = () => {
  const t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : sysDark.matches;
};
function paintThemeBtn() {
  const dark = isDark();
  themeBtn.innerHTML = (dark ? ICON_SUN : ICON_MOON) + `<span>${dark ? 'Light' : 'Dark'}</span>`;
  themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
themeBtn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
  paintThemeBtn();
});
sysDark.addEventListener('change', paintThemeBtn);
new MutationObserver(paintThemeBtn).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
paintThemeBtn();
$('#words-list').innerHTML = Object.keys(glossary).sort().map(k => `<dt>${esc(k)}</dt><dd>${esc(glossary[k])}</dd>`).join('');
$('#about-body').innerHTML = DATA.about;

// ---------- start ----------
const fromHash = () => stops.findIndex(s => '#' + s.id === location.hash);
addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== cur) go(i); });
$('#story').hidden = storyHidden; $('#story-show').hidden = !storyHidden;
const start = fromHash();
go(start >= 0 ? start : 0);
zoomTo(stops[cur], true);
})();
</script>
